  messagingSenderId: "805852798492",
  appId: "1:805852798492:web:0e2b1e4fa74850a77a09d9",
  measurementId: "G-WP4KPK7QD3"
};


      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      setPersistence(auth, browserLocalPersistence).catch(console.error);

      window.firebaseAuth = auth;
      window.firebaseDb = getFirestore(app);
      window.firebaseStorage = getStorage(app);
    </script>
  </head>

  <body>
    <header>
      <div class="brand">
        <h1>Petal Journal</h1>
        <small class="muted">your profile</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Back to Journal</a>
      </div>
    </header>

    <div class="profile-wrap">
      <main class="panel panel-pad profile-card">
        <h2 style="margin: 0 0 24px">Your Profile</h2>
        <div class="profile-pic-container">
          <img id="profilePic" class="profile-pic" src="assets/default-profile.png" alt="Profile Picture" />
          <div class="profile-pic-upload">
            <input type="file" id="picUpload" accept="image/*" hidden />
            <button class="btn" id="btnUploadPic" type="button">Upload New Picture</button>
            <small class="muted" id="picUploadMsg"></small>
          </div>
        </div>
        <div class="profile-field">
  <div class="section-title">Your Zen Level</div>
  <div class="zen-container">
    <div class="zen-info">
      <span id="zenLevel">Level 1</span>
      <span id="zenXP">0 / 100 XP</span>
      <div id="level5Badge" class="badge-hidden">
  <img src="assets/golden-sprout.gif" alt="Level 5 Badge" style="width:40px; margin-bottom:10px;">
  <span>Zen Master Achievement Unlocked!</span>
</div>
      <div id="ninjaRank" class="section-title">Rank: Genin</div>

    </div>
    <div class="zen-bar-bg">
      <div id="zenBarFill" class="zen-bar-fill"></div>
    </div>
  </div>
  <small class="muted" style="margin-top: 8px; display:block;">Earn XP by journaling, drawing, and manifesting!</small>
</div>
        <div class="profile-field">
          <div class="section-title">Email</div>
          <p id="userEmail" class="muted" style="margin: 0"></p>
        </div>
        <div class="profile-field">
          <div class="section-title">Display Name</div>
          <input class="input" id="displayName" type="text" placeholder="Your Display Name" />
          <small class="muted" id="nameUpdateMsg" style="margin-top: 8px; display:block;"></small>
        </div>
        <div class="profile-field">
          <div class="section-title">Birthday</div>
          <input class="input" id="userBirthday" type="date" />
          <small class="muted" id="birthdayUpdateMsg" style="margin-top: 8px; display:block;"></small>
        </div>
        <div class="row" style="margin-top: 24px">
          <button class="btn btn-primary" id="btnUpdateProfile" type="button">Save Profile</button>
          <small class="muted" id="generalMsg"></small>
        </div>
        <div class="divider" style="margin: 24px 0"></div>
        <div class="row">
          <button class="btn btn-accent" id="btnDeleteAccount" type="button">Delete Account</button>
          <small class="muted" id="deleteAccountMsg"></small>
        </div>
      </main>
    </div>

    <script type="module">
  import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

  const auth = window.firebaseAuth;
  const db = window.firebaseDb;
  const storage = window.firebaseStorage; // Ensure storage is linked
  let currentUser = null;

  const $ = (id) => document.getElementById(id);

  /* ------------------- Zen XP Logic ------------------- */
   function updateZenProgress() {
    const rawEntries = localStorage.getItem("petal_entries_v1") || "[]";
    const wbSaves = parseInt(localStorage.getItem("petal_whiteboard_count") || "0");
    const visionSaves = parseInt(localStorage.getItem("petal_vision_count") || "0");
    const capsuleSaves = parseInt(localStorage.getItem("petal_capsule_count") || "0");
    const wellSaves = parseInt(localStorage.getItem("petal_well_count") || "0");

    let entries = [];
    try { entries = JSON.parse(rawEntries); } catch (e) { entries = []; }

    let totalXP = (entries.length * 50) + (wbSaves * 20) + (visionSaves * 30) + (capsuleSaves * 100) + (wellSaves * 30);

    entries.forEach(e => {
      if (e.content) {
        const plainText = e.content.replace(/<[^>]*>/g, ' ');
        totalXP += plainText.split(/\s+/).filter(Boolean).length;
      }
    });

    const xpPerLevel = 200;
    const level = Math.floor(totalXP / xpPerLevel) + 1;
    const currentXPInLevel = totalXP % xpPerLevel;
    const progressPercent = (currentXPInLevel / xpPerLevel) * 100;

    // --- UI UPDATES ---
    if ($("zenLevel")) $("zenLevel").textContent = `Level ${level}`;
    if ($("zenXP")) $("zenXP").textContent = `${currentXPInLevel} / ${xpPerLevel} XP`;
    if ($("zenBarFill")) $("zenBarFill").style.width = `${progressPercent}%`;

    // --- NINJA RANK LOGIC ---
    let rank = "Genin";
    if (level >= 5) rank = "Jonin";
    if (level >= 10) rank = "Kage";
    if ($("ninjaRank")) $("ninjaRank").textContent = `Rank: ${rank}`;

    // --- LEVEL 5 REWARDS ---
    if (level >= 5) {
      if ($("level5Badge")) {
        $("level5Badge").style.display = "flex";
        const img = $("level5Badge").querySelector("img");
        if (img) img.src = "assets/golden-sprout.gif";
      }
      const optGolden = document.querySelector('option[value="golden_petal"]');
      if (optGolden) { 
        optGolden.disabled = false; 
        optGolden.textContent = "✨ Golden Petal (Unlocked!)"; 
      }
    }

    // --- LEVEL 10 REWARDS (LEGENDARY) ---
    if (level >= 10) {
      // 1. Add the Kage Aura glow to all panels
      document.querySelectorAll(".panel").forEach(p => p.classList.add("kage-aura"));

      // 2. Unlock the God-Tier Theme
      const optGod = document.querySelector('option[value="six_paths_sage"]');
      if (optGod) {
        optGod.disabled = false;
        optGod.textContent = "☀️ Six Paths Sage (LEGENDARY)";
      }
      
      // 3. Optional: Show a Level 10 badge if you have one
      if ($("level10Badge")) $("level10Badge").style.display = "flex";
    }
  }

  /* ------------------- Profile Picture Logic ------------------- */
  // Trigger file picker
  $("btnUploadPic")?.addEventListener("click", () => $("picUpload")?.click());

  // Handle file selection and upload
  $("picUpload")?.addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file || !currentUser) return;

    const msg = $("picUploadMsg");
    if (msg) msg.textContent = "Uploading...";

    try {
      const ext = file.name.split('.').pop();
      const path = `profile_pictures/${currentUser.uid}/profile.${ext}`;
      const storageRef = ref(storage, path);

      // Upload
      await uploadBytes(storageRef, file);
      // Get URL
      const photoURL = await getDownloadURL(storageRef);
      // Update Auth
      await updateProfile(currentUser, { photoURL });
      
      // Update UI
      if ($("profilePic")) $("profilePic").src = photoURL;
      if (msg) msg.textContent = "Picture updated!";
    } catch (err) {
      console.error(err);
      if (msg) msg.textContent = "Upload failed. Check rules.";
    }
  });

  /* ------------------- Profile Loading ------------------- */
  async function loadProfile(user) {
    if ($("userEmail")) $("userEmail").textContent = user.email || "";
    if ($("displayName")) $("displayName").value = user.displayName || "";
    if (user.photoURL && $("profilePic")) $("profilePic").src = user.photoURL;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists() && $("userBirthday")) {
        $("userBirthday").value = userDoc.data().birthday || "";
      }
    } catch (error) { console.error("Firestore error:", error); }
    
    updateZenProgress();
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadProfile(user);
    } else {
      window.location.href = "login.html";
    }
  });

  $("btnUpdateProfile")?.addEventListener("click", async () => {
    if (!currentUser) return;
    const nextName = $("displayName").value.trim();
    const bday = $("userBirthday").value;
    try {
      await updateProfile(currentUser, { displayName: nextName });
      await setDoc(doc(db, "users", currentUser.uid), { birthday: bday }, { merge: true });
      alert("Profile Saved!");
    } catch (e) { alert("Error saving profile."); }
  });
</script>
  </body>
</html>
