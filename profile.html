<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <title>Petal Journal — Profile</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Early Theme Loader -->
    <script>
      (function () {
        const name = localStorage.getItem("petal_theme") || "petal";
        const THEMES = {
          petal: { "--bg": "var(--rose-50)", "--surface": "var(--rose-50)", "--surface-2": "var(--pink-200)", "--border": "var(--mauve-200)", "--primary": "var(--periwinkle-400)", "--primary-soft": "var(--periwinkle-200)", "--accent": "var(--pink-500)", "--text": "#2B2B33", "--text-muted": "#5A5A6A", "--bg-spot-1": "rgba(167,171,222,.45)", "--bg-spot-2": "rgba(255,165,214,.35)" },
          midnight: { "--bg": "#0F0D14", "--surface": "#14121A", "--surface-2": "#1C1824", "--border": "rgba(255,255,255,.14)", "--primary": "#8EA2FF", "--text": "#F2F0F7", "--btn-bg": "#1C1824", "--btn-text": "#F2F0F7" },
          golden_petal: { "--bg": "#FFFDF0", "--surface": "#FFFCDB", "--surface-2": "#FFF5AD", "--border": "#E6D695", "--primary": "#FFD700", "--accent": "#DAA520", "--text": "#4A3F1F" },
          six_paths_sage: { "--bg": "#FFFFFF", "--surface": "#FDFDFD", "--surface-2": "#1A1A1A", "--border": "#FFD700", "--primary": "#FFD700", "--accent": "#000000", "--text": "#1A1A1A" }
        };
        const t = THEMES[name] || THEMES.petal;
        for (const k in t) document.documentElement.style.setProperty(k, t[k]);
      })();
    </script>

    <style>
      .profile-wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
      .profile-card { padding: 18px; }
      .profile-pic-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
      .profile-pic {
        width: 120px; height: 120px; border-radius: 50%;
        object-fit: cover; border: 4px solid var(--primary);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-soft) 70%, transparent);
      }
      .zen-container {
        margin-top: 10px; background: var(--surface-2);
        padding: 15px; border: 4px solid var(--btn-text);
        box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
      }
      .zen-info { display: flex; justify-content: space-between; font-size: 20px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
      .zen-bar-bg { width: 100%; height: 24px; background: white; border: 3px solid var(--btn-text); position: relative; }
      .zen-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.5s ease-out; }
      .badge-hidden { display: none; }
      .badge-visible {
        display: flex; flex-direction: column; align-items: center;
        background: linear-gradient(45deg, gold, #fff1a8);
        border: 4px solid #b8860b; padding: 10px; margin-top: 15px;
        color: #4a3728; font-weight: bold; animation: float 3s ease-in-out infinite;
      }
      .kage-aura { box-shadow: 0 0 20px 5px rgba(255, 215, 0, 0.4) !important; border: 2px solid #FFD700 !important; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>

    <!-- Firebase Config -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
      import { getAuth, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
      import { getFirestore } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
      import { getStorage } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBNB-V-biC7y2-dKx_qzYCpplnwU2r5PaI",
        authDomain: "petal-journal-final.firebaseapp.com",
        projectId: "petal-journal-final",
        storageBucket: "petal-journal-final.firebasestorage.app",
        messagingSenderId: "805852798492",
        appId: "1:805852798492:web:0e2b1e4fa74850a77a09d9"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      setPersistence(auth, browserLocalPersistence);
      window.firebaseAuth = auth;
      window.firebaseDb = getFirestore(app);
      window.firebaseStorage = getStorage(app);
    </script>
  </head>

  <body>
    <header>
      <div class="brand"><h1>Petal Journal</h1><small class="muted">your profile</small></div>
      <div class="top-actions"><a class="btn" href="index.html">Back</a></div>
    </header>

    <div class="profile-wrap">
      <main class="panel panel-pad profile-card">
        <h2 style="margin: 0 0 24px">Your Profile</h2>
        
        <div class="profile-pic-container">
          <img id="profilePic" class="profile-pic" src="assets/default-profile.png" />
          <div class="profile-pic-upload" style="margin-top:10px;">
            <input type="file" id="picUpload" accept="image/*" hidden />
            <button class="btn" id="btnUploadPic" type="button">Change Photo</button>
            <small id="picUploadMsg" class="muted" style="display:block; margin-top:5px;"></small>
          </div>
        </div>

        <div class="zen-container">
          <div class="zen-info">
            <span id="zenLevel">Level 1</span>
            <span id="ninjaRank">Rank: Genin</span>
            <span id="zenXP">0 / 200 XP</span>
          </div>
          <div class="zen-bar-bg"><div id="zenBarFill" class="zen-bar-fill"></div></div>
          <div id="level5Badge" class="badge-hidden">
            <img src="assets/golden-sprout.gif" style="width:30px;">
            <span>Zen Master!</span>
          </div>
        </div>

        <div class="profile-field" style="margin-top:20px;">
          <div class="section-title">Display Name</div>
          <input class="input" id="displayName" type="text" />
        </div>

        <div class="profile-field" style="margin-top:15px;">
          <div class="section-title">Birthday</div>
          <input class="input" id="userBirthday" type="date" />
        </div>

        <button class="btn btn-primary" id="btnUpdateProfile" style="margin-top:25px; width:100%;">Save Changes</button>
      </main>
    </div>

    <script type="module">
      import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
      import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
      import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

      const auth = window.firebaseAuth;
      const db = window.firebaseDb;
      const storage = window.firebaseStorage;
      let currentUser = null;
      const $ = (id) => document.getElementById(id);

      function updateZenProgress() {
        const wb = parseInt(localStorage.getItem("petal_whiteboard_count") || "0");
        const vs = parseInt(localStorage.getItem("petal_vision_count") || "0");
        const cp = parseInt(localStorage.getItem("petal_capsule_count") || "0");
        const wl = parseInt(localStorage.getItem("petal_well_count") || "0");
        const entries = JSON.parse(localStorage.getItem("petal_entries_v1") || "[]");

        let totalXP = (entries.length * 50) + (wb * 20) + (vs * 30) + (cp * 100) + (wl * 30);
        entries.forEach(e => totalXP += (e.content || "").replace(/<[^>]*>/g, ' ').split(/\s+/).filter(Boolean).length);

        const xpPerLevel = 200;
        const level = Math.floor(totalXP / xpPerLevel) + 1;
        const currentXPInLevel = totalXP % xpPerLevel;
        const progressPercent = (currentXPInLevel / xpPerLevel) * 100;

        if ($("zenLevel")) $("zenLevel").textContent = `Level ${level}`;
        if ($("zenXP")) $("zenXP").textContent = `${currentXPInLevel} / ${xpPerLevel} XP`;
        if ($("zenBarFill")) $("zenBarFill").style.width = `${progressPercent}%`;
        
        let rank = "Genin";
        if (level >= 5) rank = "Jonin";
        if (level >= 10) rank = "Kage";
        if ($("ninjaRank")) $("ninjaRank").textContent = `Rank: ${rank}`;

        if (level >= 5 && $("level5Badge")) $("level5Badge").className = "badge-visible";
        if (level >= 10) document.querySelectorAll(".panel").forEach(p => p.classList.add("kage-aura"));
      }

      $("btnUploadPic")?.addEventListener("click", () => $("picUpload")?.click());
      $("picUpload")?.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file || !currentUser) return;
        $("picUploadMsg").textContent = "Uploading...";
        try {
          const path = `profile_pictures/${currentUser.uid}/profile.${file.name.split('.').pop()}`;
          const sRef = ref(storage, path);
          await uploadBytes(sRef, file);
          const url = await getDownloadURL(sRef);
          await updateProfile(currentUser, { photoURL: url });
          $("profilePic").src = url;
          $("picUploadMsg").textContent = "Success!";
        } catch (err) { $("picUploadMsg").textContent = "Error!"; }
      });

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          $("displayName").value = user.displayName || "";
          if (user.photoURL) $("profilePic").src = user.photoURL;
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if (userDoc.exists()) $("userBirthday").value = userDoc.data().birthday || "";
          updateZenProgress();
        } else { window.location.href = "login.html"; }
      });

      $("btnUpdateProfile")?.addEventListener("click", async () => {
        if (!currentUser) return;
        try {
          await updateProfile(currentUser, { displayName: $("displayName").value.trim() });
          await setDoc(doc(db, "users", currentUser.uid), { birthday: $("userBirthday").value }, { merge: true });
          alert("Saved!");
        } catch (e) { alert("Error!"); }
      });
    </script>
  </body>
</html>
