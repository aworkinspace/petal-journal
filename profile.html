    <style>
      .profile-wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }
      .profile-card { padding: 18px; }
      .profile-field { margin-top: 16px; }
      .profile-pic-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
      .profile-pic {
        width: 120px; height: 120px; border-radius: 50%;
        object-fit: cover; border: 2px solid var(--primary);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-soft) 70%, transparent);
      }
      .profile-pic-upload { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .zen-container {
  margin-top: 10px;
  background: var(--surface-2);
  padding: 15px;
  border: 4px solid var(--btn-text);
  box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
}
.zen-info {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  margin-bottom: 10px;
}
.zen-bar-bg {
  width: 100%;
  height: 24px;
  background: white;
  border: 3px solid var(--btn-text);
  position: relative;
}
.zen-bar-fill {
  height: 100%;
  width: 0%; /* Updated by JS */
  background: var(--accent);
  transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.badge-hidden { display: none; }
.badge-visible {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(45deg, gold, #fff1a8);
  border: 4px solid #b8860b;
  padding: 10px;
  margin-top: 15px;
  color: #4a3728;
  font-weight: bold;
  animation: float 3s ease-in-out infinite;
}
#level5Badge img {
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

  <body>
    <header>

        </div>

          <div class="section-title">Birthday</div>

          <button class="btn btn-primary" id="btnUpdateProfile" type="button">Save Profile</button>
          <small class="muted" id="generalMsg"></small>

    <script type="module">
  import { onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
  import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

  const auth = window.firebaseAuth;
  const db = window.firebaseDb;
  const storage = window.firebaseStorage;
  let currentUser = null;

  /* ------------------- Zen XP Logic ------------------- */
  function updateZenProgress() {
    const rawEntries = localStorage.getItem("petal_entries_v1") || "[]";
    const whiteboardSaves = parseInt(localStorage.getItem("petal_whiteboard_count") || "0");
    const visionSaves = parseInt(localStorage.getItem("petal_vision_count") || "0");
    const capsuleSaves = parseInt(localStorage.getItem("petal_capsule_count") || "0");

    let entries = [];
    try { entries = JSON.parse(rawEntries); } catch (e) { entries = []; }

    let totalXP = 0;
    totalXP += (entries.length * 50);
    totalXP += (whiteboardSaves * 20);
    totalXP += (visionSaves * 30);
    totalXP += (capsuleSaves * 100);

    entries.forEach(e => {
      if (e.content) {
        const plainText = e.content.replace(/<[^>]*>/g, ' ');
        totalXP += plainText.split(/\s+/).filter(Boolean).length;
      }
    });

    const xpPerLevel = 200;
    const level = Math.floor(totalXP / xpPerLevel) + 1;
    const currentXPInLevel = totalXP % xpPerLevel;
    const progressPercent = (currentXPInLevel / xpPerLevel) * 100;

    if (document.getElementById("zenLevel")) document.getElementById("zenLevel").textContent = `Level ${level}`;
    if (document.getElementById("zenXP")) document.getElementById("zenXP").textContent = `${currentXPInLevel} / ${xpPerLevel} XP`;
    if (document.getElementById("zenBarFill")) document.getElementById("zenBarFill").style.width = `${progressPercent}%`;
badgeImg.src = "assets/golden-sprout.gif";

    // Reward Check
    if (level >= 5) {
      const badge = document.getElementById("level5Badge");
      if (badge) badge.style.display = "flex";
      const opt = document.querySelector('option[value="golden_petal"]');
      if (opt) { opt.disabled = false; opt.textContent = "✨ Golden Petal (Unlocked!)"; }
    }
  }

  /* ------------------- Profile Logic ------------------- */
  async function loadProfile(user) {
    if (document.getElementById("userEmail")) document.getElementById("userEmail").textContent = user.email || "";
    if (document.getElementById("displayName")) document.getElementById("displayName").value = user.displayName || "";
    if (user.photoURL && document.getElementById("profilePic")) document.getElementById("profilePic").src = user.photoURL;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        const bday = userDoc.data().birthday;
        if (document.getElementById("userBirthday")) document.getElementById("userBirthday").value = bday || "";
      }
    } catch (error) { console.error("Firestore error:", error); }
    
    updateZenProgress();
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      loadProfile(user);
    } else {
      window.location.href = "login.html";
    }
  });

  document.getElementById("btnUpdateProfile")?.addEventListener("click", async () => {
    if (!currentUser) return;
    const nextName = document.getElementById("displayName").value.trim();
    try {
      await updateProfile(currentUser, { displayName: nextName });
      await setDoc(doc(db, "users", currentUser.uid), { birthday: document.getElementById("userBirthday").value }, { merge: true });
      alert("Profile Saved!");
    } catch (e) { alert("Error saving profile."); }
  });
</script>
  </body>
