<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — Time Capsule</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Pixel Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <!-- Early Theme Loader -->
    <script>
      (function () {
        const name = localStorage.getItem("petal_theme") || "petal";
        const THEMES = {
          petal: {"--bg":"var(--rose-50)","--surface":"var(--rose-50)","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
          lavender: {"--bg":"#F6F2FF","--surface":"#F6F2FF","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
          dusky_rose: {"--bg":"#141016","--surface":"#19131C","--text":"#F2F0F7","--btn-bg":"#241A26","--btn-text":"#F2F0F7"},
          midnight: {"--bg":"#0F0D14","--surface":"#14121A","--text":"#F2F0F7","--btn-bg":"#1C1824","--btn-text":"#F2F0F7"}
        };
        const t = THEMES[name] || THEMES.petal;
        for (const k in t) document.documentElement.style.setProperty(k, t[k]);
      })();
    </script>

    <style>
      .capsule-wrap { max-width: 800px; margin: 0 auto; padding: 20px; }
      .vault-section { margin-top: 40px; }
      .capsule-card { 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 2px solid var(--border);
        background: var(--surface);
      }
      .locked { opacity: 0.7; filter: grayscale(1); cursor: not-allowed; }
      .unlocked { border-color: var(--accent); border-width: 4px; }
      
      /* Reuse your Pixel Button style */
      .btn {
        border-radius: 0; border: 4px solid var(--btn-text);
        background: var(--btn-bg); color: var(--btn-text);
        font-family: "VT323"; font-size: 20px; padding: 10px;
        text-transform: uppercase; cursor: pointer;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
      }
      .btn:active { transform: translate(2px, 2px); box-shadow: none; }
      
      .date-label { display: block; margin: 10px 0 5px; font-size: 18px; }
      textarea { width: 100%; min-height: 200px; font-family: "VT323"; font-size: 20px; padding: 15px; border-radius: 0; border: 2px solid var(--border); }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Time Capsule</h1>
        <small class="muted">letters to your future self</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html" style="text-decoration:none;">Back</a>
      </div>
    </header>

    <div class="capsule-wrap">
      <div class="panel panel-pad">
        <h2 style="margin-top:0">Write a new letter</h2>
        <textarea id="capsuleContent" placeholder="Dear future me..."></textarea>
        
        <label class="date-label">When should this capsule open?</label>
        <input type="date" id="unlockDate" class="input" style="margin-bottom:15px;" />
        
        <button class="btn" id="btnSeal" type="button">Seal Capsule 🔒</button>
      </div>

      <div class="vault-section">
        <h2>Your Vault</h2>
        <div id="capsuleList">
          <!-- Capsules will load here -->
          <p class="muted">Loading your vault...</p>
        </div>
      </div>
    </div>

    <!-- Firebase Init (Copy your exact API keys from index.html here) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import { getAuth, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBqpOzgqcRebD_yCtjW7HqIyy9rdTcCVvc",
    authDomain: "petal-journal-app.firebaseapp.com",
    databaseURL: "https://petal-journal-app-default-rtdb.firebaseio.com",
    projectId: "petal-journal-app",
    storageBucket: "petal-journal-app.firebasestorage.app",
    messagingSenderId: "162872929125",
    appId: "1:162872929125:web:89587cde0bfdd26fc94f8c",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  // Keep the session alive
  setPersistence(auth, browserLocalPersistence).catch(console.error);

  window.firebaseAuth = auth;
  window.firebaseDb = getFirestore(app);
</script>
    <!-- Connect the logic -->
    <script type="module" src="capsule.mjs"></script>
  </body>
</html>
