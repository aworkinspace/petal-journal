<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — Time Capsule</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Pixel Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <!-- Early Theme Loader -->
    <script>
      (function () {
        const THEMES = {
          petal: { "--bg": "var(--rose-50)", "--surface": "var(--rose-50)", "--surface-2": "var(--pink-200)", "--border": "var(--mauve-200)", "--primary": "var(--periwinkle-400)", "--primary-soft": "var(--periwinkle-200)", "--accent": "var(--pink-500)", "--text": "#2B2B33", "--text-muted": "#5A5A6A", "--bg-spot-1": "rgba(167,171,222,.45)", "--bg-spot-2": "rgba(255,165,214,.35)", "--btn-bg": "#ffffff", "--btn-text": "#2B2B33" },
          midnight: { "--bg": "#0F0D14", "--surface": "#14121A", "--surface-2": "#1C1824", "--border": "rgba(255,255,255,.14)", "--primary": "#8EA2FF", "--text": "#F2F0F7", "--btn-bg": "#1C1824", "--btn-text": "#F2F0F7" },
          midnight_snowfall: { "--bg": "#0B0E14", "--surface": "#12161F", "--surface-2": "#1A202C", "--border": "rgba(255,255,255,.08)", "--primary": "#A0C4FF", "--accent": "#FFFFFF", "--text": "#E0E6ED", "--btn-bg": "#1A202C", "--btn-text": "#E0E6ED" }
        };

        const name = localStorage.getItem("petal_theme") || "petal";
        const t = THEMES[name] || THEMES.petal;
        for (const k in t) document.documentElement.style.setProperty(k, t[k]);
      })(); // Fixed missing closure
    </script>

    <style>
      body {
        margin: 0;
        font-family: "VT323", monospace;
        color: var(--text);
        background: var(--bg);
      }
      .capsule-wrap { max-width: 800px; margin: 40px auto; padding: 20px; }
      .vault-section { margin-top: 40px; }
      .capsule-card { 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 4px solid var(--border);
        background: var(--surface);
        box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
      }
      .locked { opacity: 0.7; filter: grayscale(1); }
      .unlocked { border-color: var(--accent); }
      
      textarea { 
        width: 100%; min-height: 200px; 
        font-family: "VT323"; font-size: 20px; 
        padding: 15px; background: var(--surface); 
        color: var(--text); border: 4px solid var(--border); 
        outline: none;
      }

      /* Spotify Floating Widget Style */
      .spotify-widget {
        position: fixed; bottom: 20px; right: 20px;
        z-index: 1000; width: 300px; padding: 10px;
        background: var(--surface); border: 4px solid var(--btn-text);
      }
      .spotify-content { margin-top: 10px; }
      .spotify-iframe { width: 100%; height: 152px; border: 0; border-radius: 0; margin-top: 10px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Time Capsule</h1>
        <small class="muted">letters to your future self</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html" style="text-decoration:none;">Back</a>
      </div>
    </header>

    <div class="capsule-wrap">
      <div class="panel panel-pad">
        <h2 style="margin-top:0">Write a new letter</h2>
        <textarea id="capsuleContent" placeholder="Dear future me..."></textarea>
        
        <label style="display:block; margin: 15px 0 5px;">When should this capsule open?</label>
        <input type="date" id="unlockDate" class="input" style="margin-bottom:15px; font-family:'VT323'; font-size:18px;" />
        
        <button class="btn" id="btnSeal" type="button">Seal Capsule 🔒</button>
      </div>

      <div class="vault-section">
        <h2>Your Vault</h2>
        <div id="capsuleList">
          <p class="muted">Loading your vault...</p>
        </div>
      </div>
    </div>

    <!-- Spotify Widget -->
    <div class="spotify-widget panel">
      <details>
        <summary class="btn" style="font-size:14px;">🎵 Music Player</summary>
        <div class="spotify-content">
          <input class="input" id="spotifyUrl" placeholder="Paste Spotify link…" style="font-size:12px;"/>
          <div class="row" style="margin-top:8px; gap:5px; display:flex;">
            <button class="btn" id="btnSetSpotify" style="font-size:12px; flex:1;">Set</button>
            <button class="btn" id="btnClearSpotify" style="font-size:12px; flex:1;">Clear</button>
          </div>
          <div id="spotifyEmbed"></div>
        </div>
      </details>
    </div>

    <!-- Firebase Init -->
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
  import { getAuth, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
  import { initializeFirestore } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBqpOzgqcRebD_yCtjW7HqIyy9rdTcCVvc",
    authDomain: "petal-journal-app.firebaseapp.com",
    databaseURL: "https://petal-journal-app-default-rtdb.firebaseio.com",
    projectId: "petal-journal-app",
    storageBucket: "petal-journal-app.firebasestorage.app",
    messagingSenderId: "162872929125",
    appId: "1:162872929125:web:89587cde0bfdd26fc94f8c",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  setPersistence(auth, browserLocalPersistence);

  // THE NEW INIT: No cache, standard connection
  // In capsule.html, update the initFirestore line:
const db = initializeFirestore(app, {
  experimentalForceLongPolling: true,
}, "petal-db"); // Add your new database ID here


  window.firebaseAuth = auth;
  window.firebaseDb = db;
</script>

    <!-- Connect the logic -->
    <script type="module" src="capsule.mjs"></script>
  </body>
</html>
