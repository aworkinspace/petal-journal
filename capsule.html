    <style>
      body {
        margin: 0;
        font-family: "VT323", monospace;
        color: var(--text);
        background: var(--bg);
      }
      .capsule-wrap { max-width: 800px; margin: 40px auto; padding: 20px; }
      .vault-section { margin-top: 40px; }
      .capsule-card { 
        padding: 15px; 
        margin-bottom: 15px; 
        border: 4px solid var(--border);
        background: var(--surface);
        box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
      }
      .locked { opacity: 0.7; filter: grayscale(1); }
      .unlocked { border-color: var(--accent); }
      
      textarea { 
        width: 100%; min-height: 200px; 
        font-family: "VT323"; font-size: 20px; 
        padding: 15px; background: var(--surface); 
        color: var(--text); border: 4px solid var(--border); 
        outline: none;
      }

      /* Spotify Floating Widget Style */
      .spotify-widget {
        position: fixed; bottom: 20px; right: 20px;
        z-index: 1000; width: 300px; padding: 10px;
        background: var(--surface); border: 4px solid var(--btn-text);
      }
      .spotify-content { margin-top: 10px; }
      .spotify-iframe { width: 100%; height: 152px; border: 0; border-radius: 0; margin-top: 10px; }
    </style>

  <body>
    <header>
      <div class="brand">
        <h1>Time Capsule</h1>
        <small class="muted">letters to your future self</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html" style="text-decoration:none;">Back</a>
      </div>
    </header>

    <div class="capsule-wrap">
      <div class="panel panel-pad">
        <h2 style="margin-top:0">Write a new letter</h2>
        <textarea id="capsuleContent" placeholder="Dear future me..."></textarea>
        
        <label style="display:block; margin: 15px 0 5px;">When should this capsule open?</label>
        <input type="date" id="unlockDate" class="input" style="margin-bottom:15px; font-family:'VT323'; font-size:18px;" />
        
        <button class="btn" id="btnSeal" type="button">Seal Capsule 🔒</button>
      </div>

      <div class="vault-section">
        <h2>Your Vault</h2>
        <div id="capsuleList">
          <p class="muted">Loading your vault...</p>
        </div>
      </div>
    </div>

    <!-- Spotify Widget -->
    <div class="spotify-widget panel">
      <details>
        <summary class="btn" style="font-size:14px;">🎵 Music Player</summary>
        <div class="spotify-content">
          <input class="input" id="spotifyUrl" placeholder="Paste Spotify link…" style="font-size:12px;"/>
          <div class="row" style="margin-top:8px; gap:5px; display:flex;">
            <button class="btn" id="btnSetSpotify" style="font-size:12px; flex:1;">Set</button>
            <button class="btn" id="btnClearSpotify" style="font-size:12px; flex:1;">Clear</button>
          </div>
          <div id="spotifyEmbed"></div>
        </div>
      </details>
    </div>
