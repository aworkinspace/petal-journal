<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — Year in Pixels</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <style>
      .pixels-wrap { max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; }
      
      /* The Grid Layout */
      .mood-grid {
        display: grid;
        grid-template-columns: repeat(31, 1fr); /* 31 days */
        gap: 4px;
        margin-top: 20px;
        background: var(--surface);
        padding: 15px;
        border: 4px solid var(--btn-text);
      }

      .pixel-sq {
        aspect-ratio: 1;
        background: rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.1);
        border-radius: 2px;
      }

      /* Legend (Mood Keys) */
      .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; }
      .legend-item { display: flex; align-items: center; gap: 8px; font-size: 18px; }
      .swatch { width: 20px; height: 20px; border: 2px solid black; }

      /* Mood Colors */
      .m-Calm { background: #A7ABDE; }
      .m-Happy { background: #FFD700; }
      .m-Grateful { background: #FFA5D6; }
      .m-Focused { background: #14B8A6; }
      .m-Energized { background: #F97316; }
      .m-Stressed { background: #9F1239; }
      .m-Sad { background: #38BDF8; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><h1>Year in Pixels</h1><small class="muted">your emotional map</small></div>
      <div class="top-actions"><a class="btn" href="index.html">Back</a></div>
    </header>

    <div class="pixels-wrap">
      <div class="legend panel panel-pad">
        <div class="legend-item"><div class="swatch m-Happy"></div> Happy</div>
        <div class="legend-item"><div class="swatch m-Calm"></div> Calm</div>
        <div class="legend-item"><div class="swatch m-Focused"></div> Focused</div>
        <div class="legend-item"><div class="swatch m-Sad"></div> Sad</div>
        <!-- Add others as needed -->
      </div>

      <div class="mood-grid" id="pixelGrid">
        <!-- JS will generate 365 squares here -->
      </div>
      <p class="muted" style="margin-top:15px;">Each column represents a day (1-31). Each row is a month.</p>
    </div>

    <script type="module">
      const grid = document.getElementById("pixelGrid");
      const entries = JSON.parse(localStorage.getItem("petal_entries_v1") || "[]");

      // Create a Map of Date -> Mood for quick lookup
      const moodMap = {};
      entries.forEach(e => {
        // e.date is YYYY-MM-DD
        moodMap[e.date] = e.mood;
      });

      function generateGrid() {
        const year = 2026; // Current year
        for (let month = 0; month < 12; month++) {
          for (let day = 1; day <= 31; day++) {
            const sq = document.createElement("div");
            sq.className = "pixel-sq";
            
            // Format date string to match entry date format
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            if (moodMap[dateStr]) {
              sq.classList.add(`m-${moodMap[dateStr]}`);
              sq.title = `${dateStr}: ${moodMap[dateStr]}`;
            }

            grid.appendChild(sq);
          }
        }
      }
      generateGrid();
    </script>
  </body>
</html>
