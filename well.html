    <style>
      .well-wrap { max-width: 600px; margin: 40px auto; text-align: center; padding: 20px; }
      
      /* The Pond Visual */
      .pond {
        width: 100%; height: 300px;
        background: color-mix(in srgb, var(--primary-soft) 40%, #87CEEB);
        border: 8px solid var(--border);
        border-radius: 50%;
        position: relative;
        margin: 30px 0;
        overflow: hidden;
        box-shadow: inset 0 10px 30px rgba(0,0,0,0.1);
      }
      
      /* Floating Wish animations */
      .wish-petal {
        position: absolute;
        width: 20px; height: 20px;
        background: var(--accent);
        border-radius: 50% 0 50% 0;
        opacity: 0.6;
        animation: drift 10s infinite ease-in-out;
      }

      @keyframes drift {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(20px, 15px) rotate(45deg); }
      }

      .wish-input {
        width: 100%; padding: 15px;
        font-family: "VT323"; font-size: 22px;
        border: 4px solid var(--btn-text);
        background: var(--surface); color: var(--text);
        margin-bottom: 15px; outline: none;
      }

      .history-panel { margin-top: 30px; text-align: left; }
      .wish-card { padding: 10px; border-bottom: 1px solid var(--border); font-size: 18px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><h1>Wishing Well</h1></div>
      <div class="top-actions"><a class="btn" href="index.html">Back</a></div>
    </header>

    <div class="well-wrap">
      <div class="pond" id="pond">
        <!-- Drifting petals added by JS -->
      </div>

      <div class="panel panel-pad">
        <h2 style="margin-top:0">Manifest an Intention</h2>
        <input type="text" id="wishText" class="wish-input" placeholder="Type your wish here..." maxlength="100">
        <button class="btn" id="btnToss">Toss into Well ✨</button>
      </div>

      <div class="history-panel">
        <div class="section-title">Past Intentions</div>
        <div id="wishHistory"></div>
      </div>
    </div>
