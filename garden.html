      .garden-wrap { max-width: 1000px; margin: 0 auto; text-align: center; padding: 20px; }
      
      /* The Garden Plot */
      #garden-bed {
        width: 100%;
        height: 500px;
        background: #5C4033; /* Rich Soil Color */
        border: 10px solid #3d2b1f;
        border-radius: 20px;
        position: relative;
        overflow: hidden;
        image-rendering: pixelated;
        background-image: radial-gradient(#4d331f 2px, transparent 2px);
        background-size: 40px 40px;
      }

      .plant {
  position: absolute;
  bottom: 20px; /* Sits on the grass line */
  transform-origin: bottom center;
  z-index: 2;
  /* Grow-in effect */
  animation: sprout-up 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes sprout-up {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}


      .stats-panel { margin-top: 20px; font-size: 24px; }
      
      /* Grass Overlay */
      .grass {
        position: absolute;
        bottom: 0; width: 100%; height: 40px;
        background: #78B159;
        border-top: 4px solid #5C9A44;
      }
