<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — Daily Summon</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <style>
      .summon-wrap { max-width: 800px; margin: 40px auto; text-align: center; }
      
      /* The Card Visual */
      .card-display {
        perspective: 1000px;
        width: 320px;
        height: 450px;
        margin: 0 auto 30px;
      }
      .card-inner {
        position: relative;
        width: 100%; height: 100%;
        transition: transform 0.8s;
        transform-style: preserve-3d;
      }
      .card-back, .card-front {
        position: absolute;
        width: 100%; height: 100%;
        backface-visibility: hidden;
        border-radius: 15px;
        border: 4px solid var(--btn-text);
        box-shadow: var(--shadow);
      }
      .card-back {
        background: var(--surface-2);
        display: flex; align-items: center; justify-content: center;
        font-size: 50px; color: var(--btn-text);
      }
      .card-front {
        transform: rotateY(180deg);
        background: white;
      }
      .card-front img {
        width: 100%; height: 100%;
        object-fit: contain; border-radius: 10px;
      }
      
      /* Revealed State */
      .is-flipped .card-inner { transform: rotateY(180deg); }

      .shimmer {
        animation: card-glow 2s infinite alternate;
      }
      @keyframes card-glow {
        from { box-shadow: 0 0 10px var(--primary); }
        to { box-shadow: 0 0 30px 10px var(--accent); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><h1>Daily Summon</h1><small class="muted">call upon a legend</small></div>
      <div class="top-actions"><a class="btn" href="index.html">Back</a></div>
    </header>

    <div class="summon-wrap">
      <div class="card-display" id="cardContainer">
        <div class="card-inner">
          <div class="card-back">🌀</div>
          <div class="card-front" id="cardFront">
             <!-- Character Image Appears Here -->
          </div>
        </div>
      </div>

      <div class="panel panel-pad">
        <button class="btn btn-primary" id="btnSummon">Execute Summoning Jutsu! ✨</button>
        <p id="summonMsg" class="muted" style="margin-top:15px;">You can summon one legend every 24 hours.</p>
      </div>
    </div>

    <script type="module" src="summon.mjs"></script>
  </body>
</html>
