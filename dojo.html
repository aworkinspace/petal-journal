<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — Training Dojo</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <!-- Early Theme Loader (Copy the THEMES from index.html) -->
    <script>
      (function () {
        const name = localStorage.getItem("petal_theme") || "petal";
        const THEMES = {
          petal: {"--bg":"#FFF0F1","--surface":"#FFF0F1","--text":"#2B2B33","--accent":"#FFA5D6"},
          springtime_youth: {"--bg":"#0B1A0E","--surface":"#162B1A","--text":"#F2F0F7","--accent":"#FF0000"}
        };
        const t = THEMES[name] || THEMES.petal;
        for (const k in t) document.documentElement.style.setProperty(k, t[k]);
      })();
    </script>

    <style>
      .dojo-wrap { max-width: 800px; margin: 0 auto; text-align: center; padding: 20px; }
      
      /* The Sensei Area */
      .sensei-container {
        position: relative;
        height: 250px;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .gai-sprite {
        height: 180px;
        image-rendering: pixelated;
        filter: drop-shadow(0 0 10px var(--primary-soft));
        animation: youth-bounce 0.6s infinite alternate ease-in-out;
      }
      .speech-bubble {
        background: white;
        border: 4px solid black;
        padding: 10px;
        border-radius: 10px;
        font-size: 20px;
        color: black;
        margin-bottom: 10px;
        position: relative;
        max-width: 250px;
      }

      /* Habit List */
      .jutsu-list { margin-top: 20px; }
      .jutsu-item {
        display: flex;
        align-items: center;
        background: var(--surface);
        border: 4px solid var(--btn-text);
        padding: 15px;
        margin-bottom: 10px;
        box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
      }
      .jutsu-name { flex: 1; text-align: left; font-size: 24px; }
      .check-btn {
        width: 40px; height: 40px;
        border: 3px solid var(--btn-text);
        background: white;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
      }
      .checked { background: var(--primary) !important; color: white; }

      @keyframes youth-bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><h1>Training Dojo</h1><small class="muted">explode with youth!</small></div>
      <div class="top-actions"><a class="btn" href="index.html">Back</a></div>
    </header>

    <div class="dojo-wrap">
      <div class="sensei-container">
        <div class="speech-bubble" id="gaiTalk">YOU HAVE THE POWER OF YOUTH!</div>
        <!-- Use the Gai PNG you found -->
        <img src="assets/gai.png" class="gai-sprite" alt="Maito Gai Sensei">
      </div>

      <div class="panel panel-pad">
        <div class="row">
          <input type="text" id="jutsuInput" class="input" placeholder="Enter a new Jutsu (Habit)..." style="flex:1; margin-right:10px;">
          <button class="btn btn-primary" id="btnAddJutsu">Add</button>
        </div>
      </div>

      <div class="jutsu-list" id="jutsuList">
        <!-- Habits appear here -->
      </div>
    </div>

    <script type="module" src="dojo.mjs"></script>
  </body>
</html>
