<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — The Shop</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />

    <!-- Early Theme Loader -->
    <script>
      (function () {
        const name = localStorage.getItem("petal_theme") || "petal";
        const THEMES = {
          petal: { "--bg": "#FFF0F1", "--surface": "#FFF0F1", "--text": "#2B2B33", "--accent": "#FFA5D6" },
          midnight: { "--bg": "#0F0D14", "--surface": "#14121A", "--text": "#F2F0F7", "--accent": "#FFA5D6" }
        };
        const t = THEMES[name] || THEMES.petal;
        for (const k in t) document.documentElement.style.setProperty(k, t[k]);
      })();
    </script>

    <style>
      .shop-wrap { max-width: 900px; margin: 40px auto; padding: 20px; text-align: center; }
      
      /* Wallet Display */
      .wallet-panel {
        background: #FFF9E6; border: 4px solid #FACC15;
        padding: 20px; margin-bottom: 30px; border-radius: 0;
        display: inline-block; box-shadow: 6px 6px 0px rgba(0,0,0,0.1);
      }
      .wallet-panel h2 { margin: 0; color: #B45309; font-size: 32px; }

      /* Item Grid */
      .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
      }
      .shop-item {
        background: var(--surface);
        border: 4px solid var(--btn-text);
        padding: 15px;
        display: flex; flex-direction: column; align-items: center;
        transition: transform 0.2s;
      }
      .shop-item:hover { transform: translateY(-5px); }
      .shop-item img { width: 60px; height: 60px; image-rendering: pixelated; margin-bottom: 10px; }
      .price { color: #B45309; font-weight: bold; font-size: 24px; margin: 10px 0; }
      
      .owned { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
      .owned::after { content: " (OWNED)"; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><h1>Petal Shop</h1><small class="muted">upgrade your journal</small></div>
      <div class="top-actions"><a class="btn" href="index.html">Back</a></div>
    </header>

    <div class="shop-wrap">
      <div class="wallet-panel">
        <small class="muted">Current Balance</small>
        <h2>🪙 <span id="shopBalance">0</span></h2>
      </div>

      <div class="shop-grid" id="shopGrid">
        <!-- Shop items will be generated by JS -->
      </div>
    </div>

    <script type="module" src="shop.mjs"></script>
  </body>
</html>
