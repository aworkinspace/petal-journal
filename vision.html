<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petal Journal — Vision Board</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBqpOzgqcRebD_yCtjW7HqIyy9rdTcCVvc",
        authDomain: "petal-journal-app.firebaseapp.com",
        databaseURL: "https://petal-journal-app-default-rtdb.firebaseio.com",
        projectId: "petal-journal-app",
        storageBucket: "petal-journal-app.firebasestorage.app",
        messagingSenderId: "162872929125",
        appId: "1:162872929125:web:89587cde0bfdd26fc94f8c",
      };

      const app = initializeApp(firebaseConfig);

const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(console.error);

window.firebaseAuth = auth;

      window.firebaseDb = getFirestore(app);
      window.firebaseStorage = getStorage(app);
    </script>

    <style>
      .vision-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
      
      /* The Board Area */
      #board {
        width: 100%;
        height: 80vh;
        position: relative;
        background: var(--surface);
        border: 4px dashed var(--border);
        border-radius: 16px;
        overflow: hidden;
        margin-top: 20px;
        /* Pixel art background pattern */
        background-image: radial-gradient(var(--border) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Board items (images) */
      .board-item {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition: transform 0.1s ease;
      }
      .board-item img {
        max-width: 200px;
        display: block;
        border: 4px solid white;
        box-shadow: var(--shadow);
      }
      .board-item:active { cursor: grabbing; transform: scale(1.05); z-index: 100; }

      .vision-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Vision Board</h1>
        <small class="muted">manifest your dreams</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Back</a>
      </div>
    </header>

    <div class="vision-wrap">
      <div class="panel vision-tools panel-pad">
        <button class="btn" id="btnAddVision" type="button">Add Image</button>
        <button class="btn" id="btnClearBoard" type="button">Clear Board</button>
        <small class="muted">Tip: Click and drag to move items.</small>
        <input type="file" id="visionPicker" accept="image/*" hidden />
      </div>

      <div id="board">
        <!-- Images will appear here -->
      </div>
    </div>

    <!-- App Script -->
    <script type="module" src="vision.mjs"></script>
  </body>
</html>
