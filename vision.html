      html {
  height: 100%;
  background: var(--bg); /* Matches main background color */
}

body {
  margin: 0;
  /* Use the pixel font primarily, fallback to sans-serif */
  font-family: "VT323", monospace; 
  color: var(--text);
  background: var(--bg);
  /* This makes the pixel font look crisp */
  image-rendering: pixelated; 
}

.btn {
  border-radius: 0; 
  border: 4px solid var(--btn-text, #2B2B33);
  background: var(--btn-bg, #ffffff);
  color: var(--btn-text, #2B2B33);
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 400; /* VT323 usually only has one weight */
  text-transform: uppercase;
  
  /* CRITICAL: Force the font here too */
  font-family: "VT323", monospace;
  font-size: 20px; /* Make it a bit bigger for better readability */
  
  box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.1), 4px 4px 0px 0px rgba(0,0,0,0.2);
  transition: none;
  text-decoration: none;
}

/* Optional: Fix the headings and small text */
h1, .muted {
  font-family: "VT323", monospace;
}


      .vision-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
      
      /* CLEANED BOARD STYLE */
#board {
  width: 100%;
  height: 80vh;
  position: relative;
  background: var(--surface);
  border: 4px dashed var(--border);
  border-radius: 16px;
  margin-top: 20px;
  /* verification pattern */
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 20px 20px;
  
  /* THIS IS IMPORTANT: Ensure images don't vanish if they go off-edge during drag */
  overflow: auto; 
  display: block !important;
  z-index: 1;
}

.board-item {
  position: absolute;
  z-index: 100; /* High z-index to stay above background */
  display: inline-block;
  line-height: 0;
  padding: 0;
  margin: 0;
}

.board-item img {
  width: 200px; 
  height: auto;
  border: 4px solid white;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  display: block;
}


      .board-item:active { cursor: grabbing; transform: scale(1.05); z-index: 100; }

      .vision-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn:hover { transform: translate(-2px, -2px); filter: brightness(1.05); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
/* Style for the 'X' button */
.delete-btn {
  position: absolute;
  top: -10px;
  right: -10px;
  width: 24px;
  height: 24px;
  background: #ff4d4d; /* Red */
  color: white;
  border: 2px solid black;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: "VT323", monospace;
  font-size: 18px;
  font-weight: bold;
  z-index: 10;
  box-shadow: 2px 2px 0px black;
  opacity: 0; /* Hidden by default */
  transition: opacity 0.2s;
}

/* Show the 'X' when you hover over the image container */
.board-item:hover .delete-btn {
  opacity: 1;
}

.delete-btn:hover {
  background: #cc0000;
  transform: scale(1.1);
}

.delete-btn:active {
  transform: translateY(2px);
  box-shadow: none;
}
.spotify-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  width: 300px;
  max-width: 90vw;
  padding: 10px;
  background: var(--surface);
}

.spotify-widget summary {
  list-style: none;
  text-align: center;
  outline: none;
}

.spotify-content {
  margin-top: 10px;
}

.spotify-iframe {
  width: 100%;
  height: 152px; /* Smaller height for the widget */
  border: 0;
  border-radius: 12px;
  margin-top: 10px;
}

/* Fix for the widget input */
.spotify-widget .input {
  font-size: 14px;
  padding: 8px;
}
