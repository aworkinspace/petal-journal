<script>
  (function () {
    const THEMES = {
      petal: {"--bg":"var(--rose-50)","--surface":"var(--rose-50)","--surface-2":"var(--pink-200)","--border":"var(--mauve-200)","--primary":"var(--periwinkle-400)","--primary-soft":"var(--periwinkle-200)","--accent":"var(--pink-500)","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      lavender: {"--bg":"#F6F2FF","--surface":"#F6F2FF","--surface-2":"#EDE4FF","--border":"#D8CBF2","--primary":"#A7ABDE","--primary-soft":"#CED1F8","--accent":"#D7A6FF","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      sky_sorbet: {"--bg":"#F2FBFF","--surface":"#F2FBFF","--surface-2":"#DFF3FF","--border":"#C7E4F5","--primary":"#7DB6FF","--primary-soft":"#CFE4F5","--accent":"#FFA5D6","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      dusky_rose: {"--bg":"#141016","--surface":"#19131C","--surface-2":"#241A26","--border":"rgba(255,255,255,.14)","--primary":"#B7A6FF","--text":"#F2F0F7","--btn-bg":"#241A26","--btn-text":"#F2F0F7"},
      mauve_night: {"--bg":"#100F14","--surface":"#15131A","--surface-2":"#201B25","--border":"rgba(255,255,255,.14)","--primary":"#9FB6FF","--text":"#F2F0F7","--btn-bg":"#201B25","--btn-text":"#F2F0F7"},
      midnight: {"--bg":"#0F0D14","--surface":"#14121A","--surface-2":"#1C1824","--border":"rgba(255,255,255,.14)","--primary":"#8EA2FF","--text":"#F2F0F7","--btn-bg":"#1C1824","--btn-text":"#F2F0F7"}
    };

    const name = localStorage.getItem("petal_theme") || "petal";
    const t = THEMES[name] || THEMES.petal;
    for (const k in t) document.documentElement.style.setProperty(k, t[k]);
  })();
</script>

    <style>
      html {
  height: 100%;
  background: var(--bg); /* Matches main background color */
}

body {
  margin: 0;
  font-family: "VT323", ui-sans-serif, system-ui, sans-serif;
  color: var(--text);
  background: inherit;
}

      .vision-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
      
      /* The Board Area */
      #board {
        width: 100%;
        height: 80vh;
        position: relative;
        background: var(--surface);
        border: 4px dashed var(--border);
        border-radius: 16px;
        overflow: hidden;
        margin-top: 20px;
        /* Pixel art background pattern */
        background-image: radial-gradient(var(--border) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Board items (images) */
      .board-item {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition: transform 0.1s ease;
      }
      .board-item img {
        max-width: 200px;
        display: block;
        border: 4px solid white;
        box-shadow: var(--shadow);
      }
      .board-item:active { cursor: grabbing; transform: scale(1.05); z-index: 100; }

      .vision-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      /* Update the Board style */
#board {
  width: 100%;
  height: 80vh;
  position: relative;
  background: var(--surface); /* Matches theme */
  border: 4px dashed var(--border); /* Matches theme */
  border-radius: 16px;
  overflow: hidden;
  margin-top: 20px;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* Update Button styles to match Whiteboard/Main page */
.btn {
  border-radius: 0; 
  border: 4px solid var(--btn-text, #2B2B33);
  background: var(--btn-bg, #ffffff);
  color: var(--btn-text, #2B2B33);
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 600;
  text-transform: uppercase;
  font-family: "VT323", monospace;
  font-size: 18px;
  box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.1), 4px 4px 0px 0px rgba(0,0,0,0.2);
  transition: none;
  text-decoration: none;
}

.btn:hover { transform: translate(-2px, -2px); filter: brightness(1.05); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }

    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>Vision Board</h1>
        <small class="muted">manifest your dreams</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Back</a>
      </div>
    </header>

    <div class="vision-wrap">
      <div class="panel vision-tools panel-pad">
        <button class="btn" id="btnAddVision" type="button">Add Image</button>
        <button class="btn" id="btnClearBoard" type="button">Clear Board</button>
        <small class="muted">Tip: Click and drag to move items.</small>
        <input type="file" id="visionPicker" accept="image/*" hidden />
      </div>

      <div id="board">
        <!-- Images will appear here -->
      </div>
    </div>

    <!-- App Script -->
    <script type="module" src="vision.mjs"></script>
  </body>
