<script>
  (function () {
    const THEMES = {
      petal: {"--bg":"var(--rose-50)","--surface":"var(--rose-50)","--surface-2":"var(--pink-200)","--border":"var(--mauve-200)","--primary":"var(--periwinkle-400)","--primary-soft":"var(--periwinkle-200)","--accent":"var(--pink-500)","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      lavender: {"--bg":"#F6F2FF","--surface":"#F6F2FF","--surface-2":"#EDE4FF","--border":"#D8CBF2","--primary":"#A7ABDE","--primary-soft":"#CED1F8","--accent":"#D7A6FF","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      sky_sorbet: {"--bg":"#F2FBFF","--surface":"#F2FBFF","--surface-2":"#DFF3FF","--border":"#C7E4F5","--primary":"#7DB6FF","--primary-soft":"#CFE4F5","--accent":"#FFA5D6","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      dusky_rose: {"--bg":"#141016","--surface":"#19131C","--surface-2":"#241A26","--border":"rgba(255,255,255,.14)","--primary":"#B7A6FF","--text":"#F2F0F7","--btn-bg":"#241A26","--btn-text":"#F2F0F7"},
      mauve_night: {"--bg":"#100F14","--surface":"#15131A","--surface-2":"#201B25","--border":"rgba(255,255,255,.14)","--primary":"#9FB6FF","--text":"#F2F0F7","--btn-bg":"#201B25","--btn-text":"#F2F0F7"},
      midnight: {"--bg":"#0F0D14","--surface":"#14121A","--surface-2":"#1C1824","--border":"rgba(255,255,255,.14)","--primary":"#8EA2FF","--text":"#F2F0F7","--btn-bg":"#1C1824","--btn-text":"#F2F0F7"}
    };

    const name = localStorage.getItem("petal_theme") || "petal";
    const t = THEMES[name] || THEMES.petal;
    for (const k in t) document.documentElement.style.setProperty(k, t[k]);
  })();
</script>

    <style>
      html {
  height: 100%;
  background: var(--bg); /* Matches main background color */
}

body {
  margin: 0;
  /* Use the pixel font primarily, fallback to sans-serif */
  font-family: "VT323", monospace; 
  color: var(--text);
  background: var(--bg);
  /* This makes the pixel font look crisp */
  image-rendering: pixelated; 
}

.btn {
  border-radius: 0; 
  border: 4px solid var(--btn-text, #2B2B33);
  background: var(--btn-bg, #ffffff);
  color: var(--btn-text, #2B2B33);
  padding: 8px 14px;
  cursor: pointer;
  font-weight: 400; /* VT323 usually only has one weight */
  text-transform: uppercase;
  
  /* CRITICAL: Force the font here too */
  font-family: "VT323", monospace;
  font-size: 20px; /* Make it a bit bigger for better readability */
  
  box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.1), 4px 4px 0px 0px rgba(0,0,0,0.2);
  transition: none;
  text-decoration: none;
}

/* Optional: Fix the headings and small text */
h1, .muted {
  font-family: "VT323", monospace;
}


      .vision-wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }
      
      /* The Board Area */
      #board {
        width: 100%;
        height: 80vh;
        position: relative;
        background: var(--surface);
        border: 4px dashed var(--border);
        border-radius: 16px;
        overflow: hidden;
        margin-top: 20px;
        /* Pixel art background pattern */
        background-image: radial-gradient(var(--border) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Board items (images) */
      .board-item {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transition: transform 0.1s ease;
      }
      .board-item img {
  max-width: 200px;
  height: auto;      /* Ensure height isn't 0 */
  display: block;
  border: 4px solid white;
  box-shadow: var(--shadow);
  pointer-events: none; /* Helps with dragging */
}

      .board-item:active { cursor: grabbing; transform: scale(1.05); z-index: 100; }

      .vision-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      /* Update the Board style */
#board {
  width: 100%;
  height: 80vh;
  position: relative;
  background: var(--surface); /* Matches theme */
  border: 4px dashed var(--border); /* Matches theme */
  border-radius: 16px;
  overflow: hidden;
  margin-top: 20px;
  background-image: radial-gradient(var(--border) 1px, transparent 1px);
  background-size: 20px 20px;
}

.btn:hover { transform: translate(-2px, -2px); filter: brightness(1.05); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
/* Style for the 'X' button */
.delete-btn {
  position: absolute;
  top: -10px;
  right: -10px;
  width: 24px;
  height: 24px;
  background: #ff4d4d; /* Red */
  color: white;
  border: 2px solid black;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: "VT323", monospace;
  font-size: 18px;
  font-weight: bold;
  z-index: 10;
  box-shadow: 2px 2px 0px black;
  opacity: 0; /* Hidden by default */
  transition: opacity 0.2s;
}

/* Show the 'X' when you hover over the image container */
.board-item:hover .delete-btn {
  opacity: 1;
}

.delete-btn:hover {
  background: #cc0000;
  transform: scale(1.1);
}

.delete-btn:active {
  transform: translateY(2px);
  box-shadow: none;
}
.spotify-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  width: 300px;
  max-width: 90vw;
  padding: 10px;
  background: var(--surface);
}

.spotify-widget summary {
  list-style: none;
  text-align: center;
  outline: none;
}

.spotify-content {
  margin-top: 10px;
}

.spotify-iframe {
  width: 100%;
  height: 152px; /* Smaller height for the widget */
  border: 0;
  border-radius: 12px;
  margin-top: 10px;
}

/* Fix for the widget input */
.spotify-widget .input {
  font-size: 14px;
  padding: 8px;
}

    </style>

  <body>
    <header>
      <div class="brand">
        <h1>Vision Board</h1>
        <small class="muted">manifest your dreams</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Back</a>
      </div>
    </header>

    <div class="vision-wrap">
      <div class="panel vision-tools panel-pad">
        <button class="btn" id="btnAddVision" type="button">Add Image</button>
        <button class="btn" id="btnClearBoard" type="button">Clear Board</button>
        <small class="muted">Tip: Click and drag to move items.</small>
        <input type="file" id="visionPicker" accept="image/*" hidden />
      </div>

      <div id="board">
        <!-- Images will appear here -->
      </div>
    </div>
<div class="spotify-widget panel">
  <details>
    <summary class="btn">🎵 Music Player</summary>
    <div class="spotify-content">
      <input class="input" id="spotifyUrl" placeholder="Paste Spotify link…" />
      <div class="row" style="margin-top:8px; gap:5px;">
        <button class="btn" id="btnSetSpotify" style="font-size:14px;">Set</button>
        <button class="btn" id="btnClearSpotify" style="font-size:14px;">Clear</button>
      </div>
      <div id="spotifyEmbed"></div>
    </div>
  </details>
</div>

    <!-- App Script -->
    <script type="module" src="vision.mjs"></script>
  </body>
</html>
