<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <title>Petal Journal — Whiteboard</title>
    <link rel="stylesheet" href="style.css" />
<script>
  (function () {
    const THEMES = {
      petal: {"--bg":"var(--rose-50)","--surface":"var(--rose-50)","--surface-2":"var(--pink-200)","--border":"var(--mauve-200)","--primary":"var(--periwinkle-400)","--primary-soft":"var(--periwinkle-200)","--accent":"var(--pink-500)","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      lavender: {"--bg":"#F6F2FF","--surface":"#F6F2FF","--surface-2":"#EDE4FF","--border":"#D8CBF2","--primary":"#A7ABDE","--primary-soft":"#CED1F8","--accent":"#D7A6FF","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      sky_sorbet: {"--bg":"#F2FBFF","--surface":"#F2FBFF","--surface-2":"#DFF3FF","--border":"#C7E4F5","--primary":"#7DB6FF","--primary-soft":"#CFE4F5","--accent":"#FFA5D6","--text":"#2B2B33","--btn-bg":"#ffffff","--btn-text":"#2B2B33"},
      
      // DARK THEMES - These use dark button backgrounds with light text
      dusky_rose: {"--bg":"#141016","--surface":"#19131C","--surface-2":"#241A26","--border":"rgba(255,255,255,.14)","--primary":"#B7A6FF","--text":"#F2F0F7","--btn-bg":"#241A26","--btn-text":"#F2F0F7"},
      mauve_night: {"--bg":"#100F14","--surface":"#15131A","--surface-2":"#201B25","--border":"rgba(255,255,255,.14)","--primary":"#9FB6FF","--text":"#F2F0F7","--btn-bg":"#201B25","--btn-text":"#F2F0F7"},
      midnight: {"--bg":"#0F0D14","--surface":"#14121A","--surface-2":"#1C1824","--border":"rgba(255,255,255,.14)","--primary":"#8EA2FF","--text":"#F2F0F7","--btn-bg":"#1C1824","--btn-text":"#F2F0F7"}
    };

    const themeName = localStorage.getItem("petal_theme") || "petal";
    const theme = THEMES[themeName] || THEMES.petal;
    const root = document.documentElement;
    for (const k in theme) root.style.setProperty(k, theme[k]);
  })();
</script>

    <style>
      .wb-wrap{ max-width:1200px; margin:0 auto; padding:12px 24px 28px; }
      
      /* Glassmorphism Panel */
      .panel {
        background: color-mix(in srgb, var(--surface) 70%, transparent 30%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .wb-tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px; }
      .wb-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      input[type="range"]{ width:140px; }

      /* Pixel Art Buttons */
            /* Pixel Art Buttons */
      .btn {
        border-radius: 0; 
        /* Use variables so colors flip in dark mode */
        border: 4px solid var(--btn-text, #2B2B33);
        background: var(--btn-bg, #ffffff);
        color: var(--btn-text, #2B2B33);
        
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
        text-transform: uppercase;
        font-family: "VT323", monospace;
        font-size: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        
        /* Pixel shadow */
        box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.1), 4px 4px 0px 0px rgba(0,0,0,0.2);
        transition: none;
        text-decoration: none; /* For the 'Back' link */
      }

      .btn:hover { transform: translate(-2px, -2px); filter: brightness(1.05); }
      .btn:active { transform: translate(2px, 2px); box-shadow: none; }

      /* Primary (Download) button stays dark text for readability */
      .btn-primary { 
        background: var(--primary); 
        border-color: #000; 
        color: #000 !important; 
      }

      /* Fix the 'Back' button area */
      .top-actions { margin-bottom: 10px; }

      #wb{ pointer-events: auto !important; }
      .wb-stage{
        position: relative;
        width: 100%;
        height: 70vh;
      }

      #wb, #wbRef{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 16px;
        display: block;
      }
      #wbRef{ pointer-events: none; } 
      #wb { z-index: 2; }
      #wbRef { z-index: 1; }

      /* Pixel Scrollbar */
      ::-webkit-scrollbar { width: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--primary);
        border: 3px solid var(--bg);
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">
        <h1>Whiteboard</h1>
        <small class="muted">draw and doodle</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Back</a>
      </div>
    </header>

   <div class="wb-wrap">
  <div class="panel wb-tools">
    <div class="wb-row">
      <button class="btn" id="btnRef" type="button">Add reference</button>
      <button class="btn" id="btnRefClear" type="button">Clear ref</button>
      <span class="muted">Scale</span>
      <input id="refScale" type="range" min="0.2" max="2" step="0.05" value="1" />
      <input id="refPicker" type="file" accept="image/*" hidden />
    </div>

    <div class="wb-row">
      <span class="muted">Color</span>
      <input id="color" type="color" value="#A7ABDE" />
    </div>

    <div class="wb-row">
      <span class="muted">Size</span>
      <input id="size" type="range" min="1" max="30" value="6" />
    </div>

    <div class="wb-row">
      <span class="muted">Pen</span>
      <select id="penStyle" class="input" style="font-family: 'VT323';">
        <option value="smooth">Smooth</option>
        <option value="marker">Marker</option>
        <option value="highlighter">Highlighter</option>
        <option value="spray">Spray</option>
        <option value="watercolor">Watercolor</option>
      </select>
    </div>

    <div class="wb-row">
      <button class="btn" id="eraser" type="button">Eraser</button>
      <button class="btn" id="pen" type="button">Pen</button>
      <button class="btn" id="clear" type="button">Clear</button>
      <button class="btn btn-primary" id="save" type="button">Download PNG</button>
    </div>

    <small class="muted">Tip: use mouse or touch. Hold SHIFT to drag reference.</small>
  </div>

  <div class="wb-stage panel" style="padding:12px; margin-top:14px;">
    <canvas id="wb"></canvas>
    <canvas id="wbRef"></canvas>
  </div>
</div>
    <div class="music" style="justify-content:center; flex-wrap:wrap; margin: 0 24px 18px;">
      <button class="btn" id="btnMusic" type="button">Play Music</button>
      <button class="btn" id="btnNextTrack" type="button">Next</button>
      <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Music volume" />
      <audio id="bgm" src="assets/lofi.mp3" loop preload="auto"></audio>
    </div>
<audio id="clearSfx" src="assets/clear-sfx.mp3" preload="auto"></audio>
          <script>
const refCanvas = document.getElementById("wbRef");
const refCtx = refCanvas.getContext("2d");
      const canvas = document.getElementById("wb");
      const ctx = canvas.getContext("2d");

      const colorEl = document.getElementById("color");
      const sizeEl = document.getElementById("size");
      const penBtn = document.getElementById("pen");
      const eraserBtn = document.getElementById("eraser");
      const clearBtn = document.getElementById("clear");
      const saveBtn = document.getElementById("save");
      const penStyleEl = document.getElementById("penStyle");

      let drawing = false;
      let last = null;
      let mode = "pen";
      let penStyle = "smooth";
      let draggingRef = false; 


      penStyleEl?.addEventListener("change", () => (penStyle = penStyleEl.value));
      penBtn.addEventListener("click", () => (mode = "pen"));
      eraserBtn.addEventListener("click", () => (mode = "eraser"));

      function resize() {
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const stage = document.querySelector(".wb-stage");
  const rect = stage.getBoundingClientRect();

  const prev = canvas.toDataURL("image/png");

  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  refCanvas.width = Math.floor(rect.width * dpr);
  refCanvas.height = Math.floor(rect.height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  refCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, rect.width, rect.height);

  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
  img.src = prev;

  refCtx.clearRect(0, 0, rect.width, rect.height);
}

      function pos(e) {
        const rect = canvas.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - rect.left, y: p.clientY - rect.top };
      }

            function stroke(a, b) {
        const size = Number(sizeEl.value);

        // 1. ERASER MODE
        if (mode === "eraser") {
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = size;
          ctx.strokeStyle = "#ffffff"; // Eraser is just white ink
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          return;
        }

        // 2. PEN MODES
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = colorEl.value;

        // MARKER STYLE
        if (penStyle === "marker") {
          ctx.globalAlpha = 0.8;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = size * 1.5;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.globalAlpha = 1;
          return;
        }

        // HIGHLIGHTER STYLE
        if (penStyle === "highlighter") {
          ctx.globalAlpha = 0.3;
          ctx.lineCap = "butt"; // Flat ends like a real highlighter
          ctx.lineJoin = "round";
          ctx.lineWidth = size * 2.5;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.globalAlpha = 1;
          return;
        }

        // SPRAY STYLE
        if (penStyle === "spray") {
          ctx.fillStyle = colorEl.value;
          const density = 15;
          for (let i = 0; i < density; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * size * 1.5;
            const x = b.x + Math.cos(angle) * radius;
            const y = b.y + Math.sin(angle) * radius;
            ctx.beginPath();
            ctx.arc(x, y, 1, 0, Math.PI * 2);
            ctx.fill();
          }
          return;
        }

        // WATERCOLOR STYLE
        if (penStyle === "watercolor") {
          ctx.fillStyle = colorEl.value;
          const steps = 5;
          for (let i = 0; i < steps; i++) {
            const t = i / steps;
            const x = a.x + (b.x - a.x) * t;
            const y = a.y + (b.y - a.y) * t;
            const jx = (Math.random() - 0.5) * size;
            const jy = (Math.random() - 0.5) * size;
            ctx.globalAlpha = 0.1;
            ctx.beginPath();
            ctx.arc(x + jx, y + jy, size * 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          return;
        }

        // SMOOTH (DEFAULT)
        ctx.globalAlpha = 1;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = size;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }


      function down(e) { if (draggingRef) return; drawing = true; last = pos(e); }
      function move(e) { if (draggingRef || !drawing) return; e.preventDefault(); const p = pos(e); stroke(last, p); last = p; }
      function up() { drawing = false; last = null; draggingRef = false; }

      clearBtn.addEventListener("click", () => {
        const rect = canvas.getBoundingClientRect();
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, rect.width, rect.height);
        const sfx = document.getElementById("clearSfx");
        if (sfx) { sfx.currentTime = 0; sfx.play().catch(() => {}); }
      });

      saveBtn.addEventListener("click", () => {
        const a = document.createElement("a");
        a.download = "whiteboard.png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      });

      canvas.addEventListener("mousedown", down);
      canvas.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      canvas.addEventListener("touchstart", down, { passive: true });
      canvas.addEventListener("touchmove", move, { passive: false });
      window.addEventListener("touchend", up);
      resize();
      window.addEventListener("resize", resize);

      // --- Music Logic (with intro.mp3) ---
      (() => {
        const audio = document.getElementById("bgm");
        const btn = document.getElementById("btnMusic");
        const btnNext = document.getElementById("btnNextTrack");
        const vol = document.getElementById("musicVol");
        if (!audio || !btn || !vol) return;

        const tracks = ["assets/lofi.mp3", "assets/elevator.mp3", "assets/monty.mp3", "assets/intro.mp3"];
        let i = Number(localStorage.getItem("petal_track_index") || "0") % tracks.length;

        audio.volume = Number(localStorage.getItem("petal_music_vol") || 0.35);
        vol.value = audio.volume;

        function setTrack(nextIndex, autoplay = false) {
          i = (nextIndex + tracks.length) % tracks.length;
          localStorage.setItem("petal_track_index", i);
          const playing = !audio.paused;
          audio.src = tracks[i];
          if (autoplay || playing) audio.play().catch(() => {});
          btn.textContent = audio.paused ? "Play Music" : "Pause Music";
        }

        btn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); btn.textContent = audio.paused ? "Play Music" : "Pause Music"; };
        btnNext.onclick = () => setTrack(i + 1, true);
        audio.onended = () => setTrack(i + 1, true);
        vol.oninput = () => { audio.volume = vol.value; localStorage.setItem("petal_music_vol", vol.value); };
        setTrack(i, false);
      })();

      // --- Reference Image Logic ---
      (() => {
        const btnRef = document.getElementById("btnRef");
        const btnRefClear = document.getElementById("btnRefClear");
        const refPicker = document.getElementById("refPicker");
        const refScaleEl = document.getElementById("refScale");
        let refImg = null, refX = 20, refY = 20, refScale = 1, dragOffX = 0, dragOffY = 0;

        function redraw() {
          const dpr = window.devicePixelRatio || 1;
          refCtx.clearRect(0, 0, refCanvas.width/dpr, refCanvas.height/dpr);
          if (!refImg) return;
          refCtx.globalAlpha = 0.55;
          refCtx.drawImage(refImg, refX, refY, refImg.width * refScale, refImg.height * refScale);
          refCtx.globalAlpha = 1;
        }

        btnRef.onclick = () => refPicker.click();
        refPicker.onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            refImg = img;
            refScale = Math.min(1, (canvas.width/2) / img.width);
            refScaleEl.value = refScale;
            redraw();
          };
          img.src = url;
        };
        refScaleEl.oninput = () => { refScale = Number(refScaleEl.value); redraw(); };
        btnRefClear.onclick = () => { refImg = null; redraw(); };

        canvas.onmousedown = (e) => {
          if (!refImg || !e.shiftKey) return;
          const p = pos(e);
          draggingRef = true;
          dragOffX = p.x - refX; dragOffY = p.y - refY;
        };
        canvas.onmousemove = (e) => { if (draggingRef) { const p = pos(e); refX = p.x - dragOffX; refY = p.y - dragOffY; redraw(); } };
      })();
    </script>
  </body>
</html>
