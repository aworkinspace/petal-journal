          <script>
  const refCanvas = document.getElementById("wbRef");
  const refCtx = refCanvas.getContext("2d");
  const canvas = document.getElementById("wb");
  const ctx = canvas.getContext("2d");

  const colorEl = document.getElementById("color");
  const sizeEl = document.getElementById("size");
  const penBtn = document.getElementById("pen");
  const eraserBtn = document.getElementById("eraser");
  const fillBtn = document.getElementById("btnFill"); // Added for Fill
  const clearBtn = document.getElementById("clear");
  const saveBtn = document.getElementById("save");
  const penStyleEl = document.getElementById("penStyle");

  let drawing = false;
  let last = null;
  let mode = "pen";
  let penStyle = "smooth";
  let draggingRef = false;

  penStyleEl?.addEventListener("change", () => (penStyle = penStyleEl.value));
  penBtn.addEventListener("click", () => (mode = "pen"));
  eraserBtn.addEventListener("click", () => (mode = "eraser"));
  fillBtn?.addEventListener("click", () => (mode = "fill")); // Toggle Fill Mode

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const stage = document.querySelector(".wb-stage");
    const rect = stage.getBoundingClientRect();
    const prev = canvas.toDataURL("image/png");

    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    refCanvas.width = Math.floor(rect.width * dpr);
    refCanvas.height = Math.floor(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    refCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);

    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = prev;
    refCtx.clearRect(0, 0, rect.width, rect.height);
  }

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {
      x: p.clientX - rect.left,
      y: p.clientY - rect.top
    };
  }

  function stroke(a, b) {
    const size = Number(sizeEl.value);
    if (mode === "eraser") {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = size;
      ctx.strokeStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      return;
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = colorEl.value;

    if (penStyle === "marker") {
      ctx.globalAlpha = 0.8;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = size * 1.5;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }

    if (penStyle === "highlighter") {
      ctx.globalAlpha = 0.3;
      ctx.lineCap = "butt";
      ctx.lineJoin = "round";
      ctx.lineWidth = size * 2.5;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }

    if (penStyle === "spray") {
      ctx.fillStyle = colorEl.value;
      const density = 15;
      for (let i = 0; i < density; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * size * 1.5;
        const x = b.x + Math.cos(angle) * radius;
        const y = b.y + Math.sin(angle) * radius;
        ctx.beginPath();
        ctx.arc(x, y, 1, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }

    if (penStyle === "watercolor") {
      ctx.fillStyle = colorEl.value;
      const steps = 5;
      for (let i = 0; i < steps; i++) {
        const t = i / steps;
        const x = a.x + (b.x - a.x) * t;
        const y = a.y + (b.y - a.y) * t;
        const jx = (Math.random() - 0.5) * size;
        const jy = (Math.random() - 0.5) * size;
        ctx.globalAlpha = 0.1;
        ctx.beginPath();
        ctx.arc(x + jx, y + jy, size * 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      return;
    }

    ctx.globalAlpha = 1;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = size;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  // PAINT BUCKET LOGIC
  function floodFill(startX, startY, fillColor) {
    const dpr = window.devicePixelRatio || 1;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    const r = parseInt(fillColor.slice(1, 3), 16);
    const g = parseInt(fillColor.slice(3, 5), 16);
    const b = parseInt(fillColor.slice(5, 7), 16);

    const xFixed = Math.floor(startX * dpr);
    const yFixed = Math.floor(startY * dpr);
    const i = (yFixed * canvas.width + xFixed) * 4;
    const targetColor = [data[i], data[i + 1], data[i + 2], data[i + 3]];

    if (targetColor[0] === r && targetColor[1] === g && targetColor[2] === b) return;

    const stack = [[xFixed, yFixed]];
    while (stack.length) {
      const [x, y] = stack.pop();
      const idx = (y * canvas.width + x) * 4;

      if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height &&
        data[idx] === targetColor[0] && data[idx + 1] === targetColor[1] &&
        data[idx + 2] === targetColor[2] && data[idx + 3] === targetColor[3]) {

        data[idx] = r;
        data[idx + 1] = g;
        data[idx + 2] = b;
        data[idx + 3] = 255;

        stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  function down(e) {
    if (draggingRef) return;
    const p = pos(e);
    if (mode === "fill") {
      floodFill(p.x, p.y, colorEl.value);
    } else {
      drawing = true;
      last = p;
    }
  }

  function move(e) {
    if (draggingRef || !drawing || mode === "fill") return;
    e.preventDefault();
    const p = pos(e);
    stroke(last, p);
    last = p;
  }

  function up() {
    drawing = false;
    last = null;
    draggingRef = false;
  }

  clearBtn.addEventListener("click", () => {
    const rect = canvas.getBoundingClientRect();
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);
    const sfx = document.getElementById("clearSfx");
    if (sfx) {
      sfx.currentTime = 0;
      sfx.play().catch(() => {});
    }
  });

  saveBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "whiteboard.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  });

  canvas.addEventListener("mousedown", down);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  canvas.addEventListener("touchstart", down, { passive: true });
  canvas.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up);
  resize();
  window.addEventListener("resize", resize);

      // --- Music Logic (with intro.mp3) ---
      (() => {
        const audio = document.getElementById("bgm");
        const btn = document.getElementById("btnMusic");
        const btnNext = document.getElementById("btnNextTrack");
        const vol = document.getElementById("musicVol");
        if (!audio || !btn || !vol) return;

        const tracks = ["assets/lofi.mp3", "assets/elevator.mp3", "assets/monty.mp3", "assets/intro.mp3"];
        let i = Number(localStorage.getItem("petal_track_index") || "0") % tracks.length;

        audio.volume = Number(localStorage.getItem("petal_music_vol") || 0.35);
        vol.value = audio.volume;

        function setTrack(nextIndex, autoplay = false) {
          i = (nextIndex + tracks.length) % tracks.length;
          localStorage.setItem("petal_track_index", i);
          const playing = !audio.paused;
          audio.src = tracks[i];
          if (autoplay || playing) audio.play().catch(() => {});
          btn.textContent = audio.paused ? "Play Music" : "Pause Music";
        }

        btn.onclick = () => { if (audio.paused) audio.play(); else audio.pause(); btn.textContent = audio.paused ? "Play Music" : "Pause Music"; };
        btnNext.onclick = () => setTrack(i + 1, true);
        audio.onended = () => setTrack(i + 1, true);
        vol.oninput = () => { audio.volume = vol.value; localStorage.setItem("petal_music_vol", vol.value); };
        setTrack(i, false);
      })();

      // --- Reference Image Logic ---
      (() => {
        const btnRef = document.getElementById("btnRef");
        const btnRefClear = document.getElementById("btnRefClear");
        const refPicker = document.getElementById("refPicker");
        const refScaleEl = document.getElementById("refScale");
        let refImg = null, refX = 20, refY = 20, refScale = 1, dragOffX = 0, dragOffY = 0;

        function redraw() {
          const dpr = window.devicePixelRatio || 1;
          refCtx.clearRect(0, 0, refCanvas.width/dpr, refCanvas.height/dpr);
          if (!refImg) return;
          refCtx.globalAlpha = 0.55;
          refCtx.drawImage(refImg, refX, refY, refImg.width * refScale, refImg.height * refScale);
          refCtx.globalAlpha = 1;
        }

        btnRef.onclick = () => refPicker.click();
        refPicker.onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            refImg = img;
            refScale = Math.min(1, (canvas.width/2) / img.width);
            refScaleEl.value = refScale;
            redraw();
          };
          img.src = url;
        };
        refScaleEl.oninput = () => { refScale = Number(refScaleEl.value); redraw(); };
        btnRefClear.onclick = () => { refImg = null; redraw(); };

        canvas.onmousedown = (e) => {
          if (!refImg || !e.shiftKey) return;
          const p = pos(e);
          draggingRef = true;
          dragOffX = p.x - refX; dragOffY = p.y - refY;
        };
        canvas.onmousemove = (e) => { if (draggingRef) { const p = pos(e); refX = p.x - dragOffX; refY = p.y - dragOffY; redraw(); } };
      })();
            // --- Spotify Logic ---
(() => {
  const urlEl = document.getElementById("spotifyUrl");
  const btnSet = document.getElementById("btnSetSpotify");
  const btnClear = document.getElementById("btnClearSpotify");
  const host = document.getElementById("spotifyEmbed");

  if (!urlEl || !btnSet || !btnClear || !host) return;

  function toEmbed(url) {
    if (!url) return null;
    const match = url.match(/(?:playlist|album|track|show|episode)\/([a-zA-Z0-9]+)/);
    const id = match?.[1];
    let type = 'playlist';
    if (url.includes('track/')) type = 'track';
    if (url.includes('album/')) type = 'album';
    if (url.includes('show/')) type = 'show';
    if (url.includes('episode/')) type = 'episode';
    return id ? `https://open.spotify.com/embed/${type}/${id}` : null;
  }

  function render(baseEmbedUrl) {
    if (!host || !baseEmbedUrl) return;
    // Simple dark mode check
    const isDark = ["midnight", "dusky_rose", "mauve_night"].includes(localStorage.getItem("petal_theme"));
    const theme = isDark ? "dark" : "light";
    host.innerHTML = `<iframe class="spotify-iframe" src="${baseEmbedUrl}?theme=${theme}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>`;
  }

  btnSet.onclick = () => {
    const embed = toEmbed(urlEl.value.trim());
    if (embed) {
      localStorage.setItem("petal_spotify_embed", embed);
      render(embed);
    }
  };

  btnClear.onclick = () => {
    localStorage.removeItem("petal_spotify_embed");
    host.innerHTML = "";
    urlEl.value = "";
  };

  // Initial Load
  const saved = localStorage.getItem("petal_spotify_embed");
  if (saved) render(saved);
})();
