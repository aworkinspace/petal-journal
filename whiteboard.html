    <style>
      .wb-wrap{ max-width:1200px; margin:0 auto; padding:12px 24px 28px; }
      
      /* Glassmorphism Panel */
      .panel {
        background: color-mix(in srgb, var(--surface) 70%, transparent 30%);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .wb-tools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:12px; }
      .wb-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
      input[type="range"]{ width:140px; }

      /* Pixel Art Buttons */
            /* Pixel Art Buttons */
      .btn {
        border-radius: 0; 
        /* Use variables so colors flip in dark mode */
        border: 4px solid var(--btn-text, #2B2B33);
        background: var(--btn-bg, #ffffff);
        color: var(--btn-text, #2B2B33);
        
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
        text-transform: uppercase;
        font-family: "VT323", monospace;
        font-size: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        
        /* Pixel shadow */
        box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.1), 4px 4px 0px 0px rgba(0,0,0,0.2);
        transition: none;
        text-decoration: none; /* For the 'Back' link */
      }

      .btn:hover { transform: translate(-2px, -2px); filter: brightness(1.05); }
      .btn:active { transform: translate(2px, 2px); box-shadow: none; }

      /* Primary (Download) button stays dark text for readability */
      .btn-primary { 
        background: var(--primary); 
        border-color: #000; 
        color: #000 !important; 
      }

      /* Fix the 'Back' button area */
      .top-actions { margin-bottom: 10px; }

      #wb{ pointer-events: auto !important; }
      .wb-stage{
        position: relative;
        width: 100%;
        height: 70vh;
      }

      #wb, #wbRef{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 16px;
        display: block;
      }
      #wbRef{ pointer-events: none; } 
      #wb { z-index: 2; }
      #wbRef { z-index: 1; }

      /* Pixel Scrollbar */
      ::-webkit-scrollbar { width: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--primary);
        border: 3px solid var(--bg);
      }
      .spotify-widget {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  width: 300px;
  max-width: 90vw;
  padding: 10px;
  background: var(--surface);
}

.spotify-widget summary {
  list-style: none;
  text-align: center;
  outline: none;
}

.spotify-content {
  margin-top: 10px;
}

  width: 100%;
  height: 152px; /* Smaller height for the widget */
  border: 0;
  border-radius: 12px;
  margin-top: 10px;
}

/* Fix for the widget input */
.spotify-widget .input {
  font-size: 14px;
  padding: 8px;
}

    </style>
  </head>

  <body>
    <header>
      <div class="brand">
        <h1>Whiteboard</h1>
        <small class="muted">draw and doodle</small>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Back</a>
      </div>
    </header>

   <div class="wb-wrap">
  <div class="panel wb-tools">
    <div class="wb-row">
      <button class="btn" id="btnRef" type="button">Add reference</button>
      <button class="btn" id="btnRefClear" type="button">Clear ref</button>
      <span class="muted">Scale</span>
      <input id="refScale" type="range" min="0.2" max="2" step="0.05" value="1" />
      <input id="refPicker" type="file" accept="image/*" hidden />
    </div>

    <div class="wb-row">
      <span class="muted">Color</span>
      <input id="color" type="color" value="#A7ABDE" />
    </div>

    <div class="wb-row">
      <span class="muted">Size</span>
      <input id="size" type="range" min="1" max="30" value="6" />
    </div>

    <div class="wb-row">
      <span class="muted">Pen</span>
      <select id="penStyle" class="input" style="font-family: 'VT323';">
        <option value="smooth">Smooth</option>
        <option value="marker">Marker</option>
        <option value="highlighter">Highlighter</option>
        <option value="spray">Spray</option>
        <option value="watercolor">Watercolor</option>
      </select>
    </div>

    <div class="wb-row">
  <button class="btn" id="eraser" type="button">Eraser</button>
  <button class="btn" id="pen" type="button">Pen</button>
  <button class="btn" id="btnFill" type="button">Fill</button> <!-- NEW -->
  <button class="btn" id="clear" type="button">Clear</button>
  <button class="btn btn-primary" id="save" type="button">Download PNG</button>
</div>

    <small class="muted">Tip: use mouse or touch. Hold SHIFT to drag reference.</small>
  </div>

  <div class="wb-stage panel" style="padding:12px; margin-top:14px;">
    <canvas id="wb"></canvas>
    <canvas id="wbRef"></canvas>
  </div>
</div>
    <div class="music" style="justify-content:center; flex-wrap:wrap; margin: 0 24px 18px;">
      <button class="btn" id="btnMusic" type="button">Play Music</button>
      <button class="btn" id="btnNextTrack" type="button">Next</button>
      <input id="musicVol" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Music volume" />
      <audio id="bgm" src="assets/lofi.mp3" loop preload="auto"></audio>
    </div>
<audio id="clearSfx" src="assets/clear-sfx.mp3" preload="auto"></audio>
    <div class="spotify-widget panel">
  <details>
    <summary class="btn">🎵 Music Player</summary>
    <div class="spotify-content">
      <input class="input" id="spotifyUrl" placeholder="Paste Spotify link…" />
      <div class="row" style="margin-top:8px; gap:5px;">
        <button class="btn" id="btnSetSpotify" style="font-size:14px;">Set</button>
        <button class="btn" id="btnClearSpotify" style="font-size:14px;">Clear</button>
      </div>
      <div id="spotifyEmbed"></div>
    </div>
  </details>
</div>

          <script>
  const refCanvas = document.getElementById("wbRef");
  const refCtx = refCanvas.getContext("2d");
  const canvas = document.getElementById("wb");
  const ctx = canvas.getContext("2d");

  const colorEl = document.getElementById("color");
  const sizeEl = document.getElementById("size");
  const penBtn = document.getElementById("pen");
  const eraserBtn = document.getElementById("eraser");
  const fillBtn = document.getElementById("btnFill"); 
  const clearBtn = document.getElementById("clear");
  const saveBtn = document.getElementById("save");
  const penStyleEl = document.getElementById("penStyle");

  let drawing = false;
  let last = null;
  let mode = "pen";
  let penStyle = "smooth";
  let draggingRef = false;

  penStyleEl?.addEventListener("change", () => (penStyle = penStyleEl.value));
  penBtn.addEventListener("click", () => (mode = "pen"));
  eraserBtn.addEventListener("click", () => (mode = "eraser"));
  fillBtn?.addEventListener("click", () => (mode = "fill")); 

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const stage = document.querySelector(".wb-stage");
    const rect = stage.getBoundingClientRect();
    const prev = canvas.toDataURL("image/png");

    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    refCanvas.width = Math.floor(rect.width * dpr);
    refCanvas.height = Math.floor(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    refCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);

    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = prev;
    refCtx.clearRect(0, 0, rect.width, rect.height);
  }

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }

  function stroke(a, b) {
    const size = Number(sizeEl.value);
    ctx.globalCompositeOperation = "source-over";

    if (mode === "eraser") {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      return;
    }

    ctx.strokeStyle = colorEl.value;
    ctx.fillStyle = colorEl.value;

    if (penStyle === "marker") {
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = size * 1.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (penStyle === "highlighter") {
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = size * 2.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (penStyle === "spray") {
      const density = 15;
      for (let i = 0; i < density; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * size * 1.5;
        ctx.beginPath(); ctx.arc(b.x + Math.cos(angle) * radius, b.y + Math.sin(angle) * radius, 1, 0, Math.PI * 2); ctx.fill();
      }
    } else if (penStyle === "watercolor") {
      ctx.globalAlpha = 0.1;
      for (let i = 0; i < 5; i++) {
        const x = a.x + (b.x - a.x) * (i/5);
        const y = a.y + (b.y - a.y) * (i/5);
        ctx.beginPath(); ctx.arc(x + (Math.random()-0.5)*size, y + (Math.random()-0.5)*size, size*1.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  function floodFill(startX, startY, fillColor) {
    const dpr = window.devicePixelRatio || 1;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const r = parseInt(fillColor.slice(1, 3), 16), g = parseInt(fillColor.slice(3, 5), 16), b = parseInt(fillColor.slice(5, 7), 16);
    const xF = Math.floor(startX * dpr), yF = Math.floor(startY * dpr);
    const i = (yF * canvas.width + xF) * 4;
    const target = [data[i], data[i+1], data[i+2], data[i+3]];
    if (target[0] === r && target[1] === g && target[2] === b) return;
    const stack = [[xF, yF]];
    while (stack.length) {
      const [x, y] = stack.pop();
      const idx = (y * canvas.width + x) * 4;
      if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height && data[idx] === target[0] && data[idx+1] === target[1] && data[idx+2] === target[2]) {
        data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
        stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  function down(e) { 
    if (draggingRef) return; 
    const p = pos(e); 
    if (mode === "fill") { floodFill(p.x, p.y, colorEl.value); } 
    else { drawing = true; last = p; } 
  }
  function move(e) { if (!drawing || mode === "fill") return; e.preventDefault(); const p = pos(e); stroke(last, p); last = p; }
  function up() { drawing = false; last = null; draggingRef = false; }

  clearBtn.addEventListener("click", () => {
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const sfx = document.getElementById("clearSfx"); if (sfx) { sfx.currentTime = 0; sfx.play().catch(()=>{}); }
  });

  saveBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "whiteboard.png"; a.href = canvas.toDataURL("image/png"); a.click();
    // XP Reward
    let count = parseInt(localStorage.getItem("petal_whiteboard_count") || "0");
    localStorage.setItem("petal_whiteboard_count", count + 1);
  });

  canvas.addEventListener("mousedown", down);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  canvas.addEventListener("touchstart", down);
  canvas.addEventListener("touchmove", move);
  window.addEventListener("touchend", up);
  window.addEventListener("resize", resize);
  resize();

  // Music Widget Logic
  (() => {
    const audio = document.getElementById("bgm");
    const tracks = ["assets/lofi.mp3", "assets/elevator.mp3", "assets/monty.mp3", "assets/intro.mp3"];
    let i = Number(localStorage.getItem("petal_track_index") || "0") % tracks.length;
    if (audio) audio.src = tracks[i];
    document.getElementById("btnMusic").onclick = () => { if(audio.paused) audio.play(); else audio.pause(); };
    document.getElementById("btnNextTrack").onclick = () => { i = (i+1)%tracks.length; audio.src = tracks[i]; audio.play(); localStorage.setItem("petal_track_index", i); };
  })();

  // Spotify Logic
  (() => {
    const urlEl = document.getElementById("spotifyUrl"), btnSet = document.getElementById("btnSetSpotify"), btnClr = document.getElementById("btnClearSpotify"), host = document.getElementById("spotifyEmbed");
    if (!urlEl || !host) return;
    function render(base) {
      const darks = ["midnight", "cosmic_starfall", "midnight_snowfall"];
      const theme = darks.includes(localStorage.getItem("petal_theme")) ? "dark" : "light";
      host.innerHTML = `<iframe class="spotify-iframe" src="${base}?theme=${theme}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    }
    btnSet.onclick = () => { 
      const match = urlEl.value.match(/(?:playlist|track|album)\/([a-zA-Z0-9]+)/);
      if (match) { 
        const type = urlEl.value.includes("track") ? "track" : "playlist";
        const embed = `https://open.spotify.com/embed/${type}/${match[1]}`;
        localStorage.setItem("petal_spotify_embed", embed); render(embed); 
      }
    };
    btnClr.onclick = () => { localStorage.removeItem("petal_spotify_embed"); host.innerHTML = ""; };
    if (localStorage.getItem("petal_spotify_embed")) render(localStorage.getItem("petal_spotify_embed"));
  })();
</script>

  </body>
</html>
