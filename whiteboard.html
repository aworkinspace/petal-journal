          <script>
  // 1. Core Canvas Setup
  const refCanvas = document.getElementById("wbRef");
  const refCtx = refCanvas.getContext("2d");
  const canvas = document.getElementById("wb");
  const ctx = canvas.getContext("2d");

  const colorEl = document.getElementById("color");
  const sizeEl = document.getElementById("size");
  const penBtn = document.getElementById("pen");
  const eraserBtn = document.getElementById("eraser");
  const fillBtn = document.getElementById("btnFill"); 
  const clearBtn = document.getElementById("clear");
  const saveBtn = document.getElementById("save");
  const penStyleEl = document.getElementById("penStyle");

  let drawing = false;
  let last = null;
  let mode = "pen";
  let penStyle = "smooth";
  let draggingRef = false;

  penStyleEl?.addEventListener("change", () => (penStyle = penStyleEl.value));
  penBtn.addEventListener("click", () => (mode = "pen"));
  eraserBtn.addEventListener("click", () => (mode = "eraser"));
  fillBtn?.addEventListener("click", () => (mode = "fill")); 

  function resize() {
    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const stage = document.querySelector(".wb-stage");
    const rect = stage.getBoundingClientRect();
    const prev = canvas.toDataURL("image/png");

    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    refCanvas.width = Math.floor(rect.width * dpr);
    refCanvas.height = Math.floor(rect.height * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    refCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, rect.width, rect.height);

    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = prev;
    refCtx.clearRect(0, 0, rect.width, rect.height);
  }

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }

  // 2. Drawing Logic (Styles)
  function stroke(a, b) {
    const size = Number(sizeEl.value);
    ctx.globalCompositeOperation = "source-over";

    if (mode === "eraser") {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      return;
    }

    ctx.strokeStyle = colorEl.value;
    ctx.fillStyle = colorEl.value;

    if (penStyle === "marker") {
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = size * 1.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (penStyle === "highlighter") {
      ctx.globalAlpha = 0.3;
      ctx.lineWidth = size * 2.5;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (penStyle === "spray") {
      const density = 15;
      for (let i = 0; i < density; i++) {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * size * 1.5;
        ctx.beginPath(); ctx.arc(b.x + Math.cos(angle) * radius, b.y + Math.sin(angle) * radius, 1, 0, Math.PI * 2); ctx.fill();
      }
    } else if (penStyle === "watercolor") {
      ctx.globalAlpha = 0.1;
      for (let i = 0; i < 5; i++) {
        const x = a.x + (b.x - a.x) * (i/5);
        const y = a.y + (b.y - a.y) * (i/5);
        ctx.beginPath(); ctx.arc(x + (Math.random()-0.5)*size, y + (Math.random()-0.5)*size, size*1.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.lineWidth = size;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  // 3. Paint Bucket logic
  function floodFill(startX, startY, fillColor) {
    const dpr = window.devicePixelRatio || 1;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const r = parseInt(fillColor.slice(1, 3), 16), g = parseInt(fillColor.slice(3, 5), 16), b = parseInt(fillColor.slice(5, 7), 16);
    const xF = Math.floor(startX * dpr), yF = Math.floor(startY * dpr);
    const i = (yF * canvas.width + xF) * 4;
    const target = [data[i], data[i+1], data[i+2], data[i+3]];
    if (target[0] === r && target[1] === g && target[2] === b) return;
    const stack = [[xF, yF]];
    while (stack.length) {
      const [x, y] = stack.pop();
      const idx = (y * canvas.width + x) * 4;
      if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height && data[idx] === target[0] && data[idx+1] === target[1] && data[idx+2] === target[2]) {
        data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
        stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // 4. Input Handlers
  function down(e) { 
    if (draggingRef) return; 
    const p = pos(e); 
    if (mode === "fill") { floodFill(p.x, p.y, colorEl.value); } 
    else { drawing = true; last = p; } 
  }
  function move(e) { if (!drawing || mode === "fill") return; e.preventDefault(); const p = pos(e); stroke(last, p); last = p; }
  function up() { drawing = false; last = null; draggingRef = false; }

  clearBtn.addEventListener("click", () => {
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const sfx = document.getElementById("clearSfx"); if (sfx) { sfx.currentTime = 0; sfx.play().catch(()=>{}); }
  });

  saveBtn.addEventListener("click", () => {
    const a = document.createElement("a");
    a.download = "whiteboard.png"; a.href = canvas.toDataURL("image/png"); a.click();
    let count = parseInt(localStorage.getItem("petal_whiteboard_count") || "0");
    localStorage.setItem("petal_whiteboard_count", count + 1);
  });

  canvas.addEventListener("mousedown", down);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  canvas.addEventListener("touchstart", down);
  canvas.addEventListener("touchmove", move);
  window.addEventListener("touchend", up);
  window.addEventListener("resize", resize);
  resize();

  // 5. Reference Image Logic
  (() => {
    const btnRef = document.getElementById("btnRef");
    const refPicker = document.getElementById("refPicker");
    const refScaleEl = document.getElementById("refScale");
    let refImg = null, refX = 20, refY = 20, refScale = 1;

    function redrawRef() {
      const dpr = window.devicePixelRatio || 1;
      refCtx.clearRect(0, 0, refCanvas.width/dpr, refCanvas.height/dpr);
      if (!refImg) return;
      refCtx.globalAlpha = 0.5;
      refCtx.drawImage(refImg, refX, refY, refImg.width * refScale, refImg.height * refScale);
    }

    btnRef.onclick = () => refPicker.click();
    refPicker.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        refImg = img;
        refScale = Math.min(1, (canvas.width/2.5) / img.width);
        if(refScaleEl) refScaleEl.value = refScale;
        redrawRef();
      };
      img.src = URL.createObjectURL(file);
    };
    if(refScaleEl) refScaleEl.oninput = () => { refScale = Number(refScaleEl.value); redrawRef(); };
    document.getElementById("btnRefClear").onclick = () => { refImg = null; redrawRef(); };
  })();

  // 6. Music & Spotify Logic
  (() => {
    const audio = document.getElementById("bgm");
    const tracks = ["assets/lofi.mp3", "assets/elevator.mp3", "assets/monty.mp3", "assets/intro.mp3"];
    let i = Number(localStorage.getItem("petal_track_index") || "0") % tracks.length;
    if (audio) {
        audio.src = tracks[i];
        audio.volume = Number(localStorage.getItem("petal_music_vol") || 0.35);
    }
    document.getElementById("btnMusic").onclick = () => { if(audio.paused) audio.play(); else audio.pause(); };
    document.getElementById("btnNextTrack").onclick = () => { i = (i+1)%tracks.length; audio.src = tracks[i]; audio.play(); localStorage.setItem("petal_track_index", i); };

    const urlEl = document.getElementById("spotifyUrl"), btnSet = document.getElementById("btnSetSpotify"), btnClr = document.getElementById("btnClearSpotify"), host = document.getElementById("spotifyEmbed");
    if (!urlEl || !host) return;
    function renderSpot(base) {
      const darks = ["midnight", "cosmic_starfall", "shadow_possession", "copy_ninja", "eternal_amaterasu"];
      const theme = darks.includes(localStorage.getItem("petal_theme")) ? "dark" : "light";
      host.innerHTML = `<iframe class="spotify-iframe" style="width:100%; height:152px; border:0; border-radius:12px; margin-top:10px;" src="${base}?theme=${theme}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
    }
    btnSet.onclick = () => { 
      const match = urlEl.value.match(/(?:playlist|track|album|show|episode)\/([a-zA-Z0-9]+)/);
      if (match) { 
        const type = urlEl.value.includes("track") ? "track" : "playlist";
        const embed = `https://open.spotify.com/embed/${type}/${match[1]}`;
        localStorage.setItem("petal_spotify_embed", embed); renderSpot(embed); 
      }
    };
    btnClr.onclick = () => { localStorage.removeItem("petal_spotify_embed"); host.innerHTML = ""; };
    if (localStorage.getItem("petal_spotify_embed")) renderSpot(localStorage.getItem("petal_spotify_embed"));
  })();

  // 7. Seasonal Animations (Matches main page)
  (() => {
    const overlay = document.createElement("div");
    overlay.id = "animation-overlay";
    overlay.style.cssText = "position:fixed; inset:0; pointer-events:none; z-index:1;";
    document.body.prepend(overlay);
    let animationInterval = null;

    function startAnimation(type) {
      if (animationInterval) clearInterval(animationInterval);
      overlay.innerHTML = "";
      if (!type) return;
      animationInterval = setInterval(() => {
        const particle = document.createElement("div");
        const startX = Math.random() * window.innerWidth;
        if (type === "meteors") { particle.className = "meteor"; particle.style.left = (startX + 400) + "px"; particle.style.top = "-50px"; }
        else if (type === "leaves") { particle.className = "leaf"; particle.style.left = startX + "px"; particle.style.top = "-50px"; }
        else if (type === "blossoms") { particle.className = "blossom"; particle.style.left = startX + "px"; particle.style.top = "-50px"; }
        else if (type === "snow") { particle.className = "snowflake"; particle.style.left = startX + "px"; particle.style.top = "-10px"; const size = Math.random() * 4 + 2 + "px"; particle.style.width = size; particle.style.height = size; }
        overlay.appendChild(particle);
        setTimeout(() => particle.remove(), 8000);
      }, 800);
    }
    const map = { cosmic_starfall: "meteors", autumn_forest: "leaves", spring_blossom: "blossoms", midnight_snowfall: "snow" };
    startAnimation(map[localStorage.getItem("petal_theme")] || null);
  })();
</script>
  </body>
